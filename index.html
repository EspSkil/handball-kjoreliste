<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kjøreliste håndball</title>

    * {
      box-sizing: border-box;
    }

    :root {
      --navy: #0b2a4a;
      --navy-2: #123f6d;
      --green: #169b62;
      --green-soft: #eaf7f0;
      --blue: #2668b5;
      --blue-soft: #eef5fc;
      --red: #d64b4b;
      --red-soft: #fff1f1;
      --text: #172033;
      --muted: #6f7785;
      --border: #e2e7ed;
      --bg: #f5f7fa;
      --card: #ffffff;
      --shadow: 0 5px 18px rgba(0,0,0,.07);
    }

    body {
      margin: 0;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    select,
    input {
      font: inherit;
    }

      margin: 0 auto;
      background: #fff;
      min-height: 100vh;
      box-shadow: 0 0 30px rgba(0,0,0,.04);

    .header {
      background:

      color: white;
      padding: 22px 18px 20px;
    }

    .header-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 3px solid #f4c94f;
      color: #f4c94f;
      display: grid;
      place-items: center;
      font-size: 27px;
      flex: 0 0 auto;
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.05;
    }

    .header .season {
      margin-top: 5px;
      font-size: 17px;
      opacity: .85;
    }

    .toolbar {
      padding: 16px 14px 6px;
      background: white;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1.25fr 1fr 1fr;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: white;
    }

    .tab {
      appearance: none;
      border: 0;
      border-right: 1px solid var(--border);
      background: white;
      padding: 13px 8px;
      color: #344055;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
    }

    .tab:last-child {
      border-right: 0;
    }

    .tab.active {
      background: var(--green);
      color: white;
    }

    .content {
      padding: 8px 14px 35px;
    }

    .week-section {
      margin-top: 22px;
    }

    .week-title {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 10px;
      font-size: 21px;
      font-weight: 800;
    }

    .week-title.current {
      color: var(--text);
    }

    .week-title-icon {
      font-size: 20px;
    }

    .ride-card {
      display: grid;
      grid-template-columns: 86px minmax(0, 1fr) 145px 145px 86px;
      gap: 10px;
      align-items: center;
      padding: 10px;
      margin-bottom: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }

    .date-box {
      border-radius: 11px;
      padding: 7px 6px;
      text-align: center;
      background: var(--green-soft);
      color: #177844;
      min-height: 88px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .ride-card.next-week .date-box {
      background: var(--blue-soft);
      color: #245b98;
    }

    .date-day {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .4px;
    }

    .date-number {
      font-size: 30px;
      font-weight: 900;
      line-height: 1;
      margin: 3px 0;
    }

    .date-month {
      font-size: 12px;
      font-weight: 700;
    }

    .details {
      min-width: 0;
    }

    .detail-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin: 5px 0;
      font-size: 15px;
    }

    .detail-icon {
      width: 20px;
      text-align: center;
      flex: 0 0 auto;
    }

    .assignment {
      min-width: 0;
      border-left: 1px solid var(--border);
      padding-left: 12px;
    }

    .assignment-label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .35px;
      margin-bottom: 4px;
    }

    .assignment-person {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 17px;
      font-weight: 800;
      line-height: 1.1;
    }

    .assignment-icon {
      font-size: 22px;
    }

    .swap-button {
      border: 0;
      border-radius: 10px;
      background: var(--green-soft);
      color: #157842;
      padding: 10px 7px;
      font-weight: 800;
      cursor: pointer;
      min-height: 64px;
    }

    .ride-card.next-week .swap-button {
      background: var(--blue-soft);
      color: var(--blue);
    }

    .swap-icon {
      display: block;
      font-size: 25px;
      line-height: 1;
      margin-bottom: 3px;
    }

    .holiday {
      margin-top: 15px;
      border: 1px solid #f2a5a5;
      background: var(--red-soft);
      border-radius: 14px;
      padding: 15px;
      color: #a82d2d;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .holiday-icon {
      font-size: 34px;
    }

    .holiday-title {
      font-weight: 900;
      font-size: 17px;
    }

    .holiday-text {
      margin-top: 2px;
      color: #454d5a;
      font-size: 14px;
    }

    .footer-card {
      margin-top: 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: white;
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .footer-card .big-icon {

    }

    .footer-title {
      font-weight: 900;
    }

    .footer-text {
      color: var(--muted);
      font-size: 13px;
      margin-top: 2px;
    }

    .hidden {
      display: none !important;
    }

    .modal-backdrop {

      inset: 0;
      background: rgba(5,18,30,.54);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 100;
    }

    .modal-backdrop.show {

    }

    .modal {

      overflow-y: auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 24px 60px rgba(0,0,0,.22);

      gap: 12px;
      align-items: flex-start;
    }

    .modal-title {

      font-weight: 900;
    }

    .close-button {

      border: 0;
      background: transparent;
      font-size: 25px;
      cursor: pointer;
    }

    .modal-date {

      margin-top: 3px;
      font-size: 14px;
    }

    .change-grid {

      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 18px;
    }

    .change-box {

      border-radius: 12px;
      padding: 12px;
    }

    .change-label {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .current-driver {

      font-weight: 900;
      margin-bottom: 10px;
    }

      border-radius: 9px;
      padding: 10px 11px;
      background: white;
      color: var(--text);

    }

    .pin-label {

      font-weight: 800;
      margin-bottom: 7px;
    }

      letter-spacing: 8px;
      font-weight: 900;
      font-size: 20px;

      margin-top: 6px;
    }

      gap: 10px;
      margin-top: 18px;
      padding-top: 15px;
      border-top: 1px solid var(--border);

      border-radius: 9px;
      padding: 10px 16px;
      font-weight: 800;
      cursor: pointer;
      border: 1px solid var(--border);
    }

      background: white;
      color: var(--text);
    }

    .btn-save {
      border-color: var(--green);

      color: white;
    }

      font-size: 13px;
      display: none;
    }

      }

      }

        padding-right: 10px;
      }

      .tab {

        padding: 12px 5px;
      }

      .week-title {
        font-size: 19px;
      }

        grid-template-areas:

          "date to swap"
          "date from swap";
        gap: 7px 9px;
        padding: 8px;
      }

      .date-box {
        grid-area: date;
        min-height: 110px;
        align-self: stretch;
      }

      .date-number {
        font-size: 26px;
      }

      }

      .assignment.to {
        grid-area: to;
      }

      .assignment.from {

      }

        margin-bottom: 2px;

      }

      }

      .swap-button {

        min-height: 100%;
        padding: 7px 4px;
        font-size: 12px;
      }

      }

      .detail-row {
        font-size: 13px;
        margin: 3px 0;
      }

      .change-grid {
        grid-template-columns: 1fr;
      }

      .modal-actions {
        display: grid;
        grid-template-columns: 1fr 1.2fr;
      }
    }
  </style>
</head>

</div>

function parseDate(dateString) {
  const [year, month, day] = dateString.split("-").map(Number);
  return new Date(year, month - 1, day);
}


function formatDate(dateString) {
  const date = parseDate(dateString);

  return new Intl.DateTimeFormat("no-NO", {
    weekday: "long",
    day: "numeric",
    month: "long"
  }).format(date);
}


function getDateParts(dateString) {

  const date = parseDate(dateString);

  const weekday = new Intl.DateTimeFormat("no-NO", {
    weekday: "short"
  })
    .format(date)
    .replace(".", "")
    .toUpperCase();

  const day = date.getDate();

  const month = new Intl.DateTimeFormat("no-NO", {
    month: "short"
  })
    .format(date)
    .replace(".", "")
    .toUpperCase();

  return {
    weekday,
    day,
    month
  };
}


function transportIcon(person) {

  if (person === "Jentene") {
    return "🚋";
  }

  if (person === "Ingen") {
    return "—";
  }

  return "🚗";
}


function getCurrentWeek() {

  const today = new Date();

  today.setHours(0,0,0,0);

  const firstRide = rides.find(
    ride => parseDate(ride.date) >= today
  );

  if (firstRide) {
    return firstRide.week;
  }

  return rides[rides.length - 1].week;
}


function renderSchedule() {

  scheduleEl.innerHTML = "";

  const currentWeek = getCurrentWeek();

  let weeks;

  if (currentMode === "all") {

    weeks = [...new Set(rides.map(r => r.week))];

  } else {

    const count = Number(currentMode);

    weeks = [];

    for (let i = 0; i < count; i++) {
      weeks.push(currentWeek + i);
    }

  }


  weeks.forEach((week, index) => {

    const weekRides = rides.filter(
      ride => ride.week === week
    );

    if (!weekRides.length) {
      return;
    }


    const allHoliday = weekRides.every(
      ride => ride.holiday
    );


    if (allHoliday) {

      const holiday = document.createElement("div");

      holiday.className = "holiday";

      holiday.innerHTML = `
        <div class="holiday-icon">🍂</div>

        <div>
          <div class="holiday-title">
            Høstferie – uke ${week}
          </div>

          <div class="holiday-text">
            Ingen trening denne uken.
          </div>
        </div>
      `;

      scheduleEl.appendChild(holiday);

      return;
    }


    const section = document.createElement("section");

    section.className = "week-section";


    const title = document.createElement("div");

    title.className = "week-title";


    let titleText = `Uke ${week}`;

    if (week === currentWeek) {
      titleText = `Denne uken – uke ${week}`;
    }

    else if (week === currentWeek + 1) {
      titleText = `Neste uke – uke ${week}`;
    }


    title.innerHTML = `
      <span class="week-title-icon">📅</span>
      <span>${titleText}</span>
    `;

    section.appendChild(title);


    weekRides.forEach(ride => {

      if (ride.holiday) {
        return;
      }

      section.appendChild(
        createRideCard(
          ride,
          week !== currentWeek
        )
      );

    });


    scheduleEl.appendChild(section);

  });


  const footer = document.createElement("div");

  footer.className = "footer-card";

  footer.innerHTML = `
    <div class="big-icon">🚗</div>

    <div>
      <div class="footer-title">
        Husk samkjøring
      </div>

      <div class="footer-text">
        Avtal bytte direkte, og oppdater deretter kjørelisten.
      </div>
    </div>
  `;

  scheduleEl.appendChild(footer);

}


function createRideCard(ride, nextWeek) {

  const date = getDateParts(ride.date);

  const card = document.createElement("div");

  card.className =
    "ride-card" +
    (nextWeek ? " next-week" : "");


  card.innerHTML = `

    <div class="date-box">

      <div class="date-day">
        ${date.weekday}
      </div>

      <div class="date-number">
        ${date.day}
      </div>

      <div class="date-month">
        ${date.month}
      </div>

    </div>


    <div class="details">

      <div class="detail-row">
        <div class="detail-icon">🕒</div>
        <div>${ride.time}</div>
      </div>

      <div class="detail-row">
        <div class="detail-icon">📍</div>
        <div>${ride.place}</div>
      </div>

    </div>


    <div class="assignment to">

      <div class="assignment-label">
        Til trening
      </div>

      <div class="assignment-person">

        <span class="assignment-icon">
          ${transportIcon(ride.to)}
        </span>

        <span>${ride.to}</span>

      </div>

    </div>


    <div class="assignment from">

      <div class="assignment-label">
        Hente
      </div>

      <div class="assignment-person">

        <span class="assignment-icon">
          ${transportIcon(ride.from)}
        </span>

        <span>${ride.from}</span>

      </div>

    </div>


    <button
      class="swap-button"
      data-id="${ride.id}"
    >

      <span class="swap-icon">
        ⇄
      </span>

      Bytte

    </button>

  `;


  card
    .querySelector(".swap-button")
    .addEventListener(
      "click",
      () => openModal(ride.id)
    );


  return card;

}


function openModal(rideId) {

  selectedRideId = rideId;

  const ride = rides.find(
    ride => ride.id === rideId
  );

  modalDate.textContent =
    `${formatDate(ride.date)} · ${ride.time} · ${ride.place}`;

  currentTo.innerHTML =
    `${transportIcon(ride.to)} ${ride.to}`;

  currentFrom.innerHTML =
    `${transportIcon(ride.from)} ${ride.from}`;

  newTo.value = "";
  newFrom.value = "";

  pin.value = "";

  clearMessage();

  backdrop.classList.add("show");

  setTimeout(() => {
    newTo.focus();
  }, 50);

}


function closeModal() {

  backdrop.classList.remove("show");

  selectedRideId = null;

  clearMessage();

}


function saveChange() {

  const ride = rides.find(
    ride => ride.id === selectedRideId
  );

  if (!ride) {
    return;
  }


  if (pin.value !== TEST_PIN) {

    showMessage(
      "Feil PIN-kode.",
      "error"
    );

    return;

  }


  if (!newTo.value && !newFrom.value) {

    showMessage(
      "Velg minst én endring.",
      "error"
    );

    return;

  }


  if (newTo.value) {
    ride.to = newTo.value;
  }

  if (newFrom.value) {
    ride.from = newFrom.value;
  }


  renderSchedule();


  showMessage(
    "Kjøringen er oppdatert i testvisningen.",
    "success"
  );


  setTimeout(() => {
    closeModal();
  }, 800);

}


function showMessage(text, type) {

  message.className = `message ${type}`;
  message.textContent = text;

}


function clearMessage() {

  message.className = "message";
  message.textContent = "";

}


document
  .querySelectorAll(".tab")
  .forEach(tab => {

    tab.addEventListener("click", () => {

      document
        .querySelectorAll(".tab")
        .forEach(t =>
          t.classList.remove("active")
        );


      tab.classList.add("active");

      currentMode =
        tab.dataset.mode;

      renderSchedule();

    });

  });


document
  .getElementById("closeModal")
  .addEventListener(
    "click",
    closeModal
  );


document
  .getElementById("cancelButton")
  .addEventListener(
    "click",
    closeModal
  );


document
  .getElementById("saveButton")
  .addEventListener(
    "click",
    saveChange
  );


backdrop.addEventListener(
  "click",
  event => {

    if (event.target === backdrop) {
      closeModal();
    }

  }
);


document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Escape" &&
      backdrop.classList.contains("show")
    ) {
      closeModal();
    }

  }
);


renderSchedule();

</script>

</body>
</html>
