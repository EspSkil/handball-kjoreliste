<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#082742">

  <title>Kjøreliste håndball</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --navy: #082742;
      --green: #159a61;
      --green-soft: #e8f6ee;
      --blue: #2266b0;
      --blue-soft: #edf4fb;

      --text: #172033;
      --muted: #6e7785;
      --border: #dfe5eb;
      --background: #f3f6f9;
      --card: #ffffff;

      --past-bg: #f1f3f5;
      --past-date: #e2e5e8;
      --past-text: #7a818a;

      --red: #c94141;
      --red-soft: #fff0f0;

      --shadow: 0 4px 14px rgba(0,0,0,.055);
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: var(--background);
      color: var(--text);
    }

    button,
    select,
    input {
      font: inherit;
    }

    .app {
      max-width: 820px;
      margin: 0 auto;
      min-height: 100vh;
      background: white;
      box-shadow: 0 0 30px rgba(0,0,0,.04);
    }


    /* HEADER */

    .header {
      background: linear-gradient(
        135deg,
        var(--navy),
        #061a2e
      );

      color: white;
      padding: 22px 18px 20px;
    }

    .header-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 54px;
      height: 54px;

      border-radius: 50%;
      border: 3px solid #f5c945;

      color: #f5c945;

      display: grid;
      place-items: center;

      font-size: 27px;
      flex-shrink: 0;
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.05;
    }

    .season {
      margin-top: 5px;
      font-size: 17px;
      opacity: .86;
    }


    /* TABS */

    .toolbar {
      padding: 16px 14px 6px;
      background: white;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1.25fr 1fr 1fr;

      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    .tab {
      border: 0;
      border-right: 1px solid var(--border);

      background: white;
      color: #344055;

      padding: 13px 8px;

      font-weight: 750;
      font-size: 14px;

      cursor: pointer;
    }

    .tab:last-child {
      border-right: 0;
    }

    .tab.active {
      background: var(--green);
      color: white;
    }


    /* CONTENT */

    .content {
      padding: 8px 14px 35px;
    }

    .week-section {
      margin-top: 22px;
    }

    .week-title {
      display: flex;
      align-items: center;
      gap: 9px;

      margin-bottom: 10px;

      font-size: 21px;
      font-weight: 850;
    }


    /* CARDS */

    .ride-card {
      display: grid;

      grid-template-columns:
        86px
        minmax(0,1fr)
        145px
        145px
        86px;

      gap: 10px;
      align-items: center;

      padding: 10px;
      margin-bottom: 10px;

      background: var(--card);

      border: 1px solid var(--border);
      border-radius: 14px;

      box-shadow: var(--shadow);

      transition:
        opacity .2s,
        background .2s;
    }

    .date-box {
      border-radius: 11px;

      padding: 7px 6px;

      text-align: center;

      background: var(--green-soft);
      color: #147743;

      min-height: 88px;

      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .ride-card.next-week .date-box {
      background: var(--blue-soft);
      color: #245c99;
    }

    .date-day {
      font-size: 12px;
      font-weight: 850;
      text-transform: uppercase;
    }

    .date-number {
      font-size: 30px;
      font-weight: 900;
      line-height: 1;

      margin: 3px 0;
    }

    .date-month {
      font-size: 12px;
      font-weight: 750;
    }


    /* DETAILS */

    .details {
      min-width: 0;
    }

    .detail-row {
      display: flex;
      align-items: center;
      gap: 8px;

      margin: 5px 0;

      font-size: 15px;
    }

    .detail-icon {
      width: 20px;
      text-align: center;
      flex-shrink: 0;
    }


    /* DRIVER */

    .assignment {
      min-width: 0;

      border-left: 1px solid var(--border);
      padding-left: 12px;
    }

    .assignment-label {
      font-size: 11px;
      color: var(--muted);

      font-weight: 850;

      text-transform: uppercase;
      letter-spacing: .35px;

      margin-bottom: 4px;
    }

    .assignment-person {
      display: flex;
      align-items: center;
      gap: 7px;

      font-size: 17px;
      font-weight: 850;

      line-height: 1.1;
    }

    .assignment-icon {
      font-size: 22px;
    }


    /* SWAP */

    .swap-button {
      border: 0;
      border-radius: 10px;

      background: var(--green-soft);
      color: #157842;

      padding: 10px 7px;

      font-weight: 850;

      cursor: pointer;

      min-height: 64px;
    }

    .ride-card.next-week .swap-button {
      background: var(--blue-soft);
      color: var(--blue);
    }

    .swap-icon {
      display: block;

      font-size: 25px;
      line-height: 1;

      margin-bottom: 3px;
    }


    /* PAST RIDES */

    .ride-card.past {
      background: var(--past-bg);

      color: var(--past-text);

      box-shadow: none;

      opacity: .68;
    }

    .ride-card.past .date-box {
      background: var(--past-date);
      color: #6f767e;
    }

    .ride-card.past .assignment-label {
      color: #8b9198;
    }

    .ride-card.past .assignment {
      border-color: #d5d9dd;
    }

    .ride-card.past .swap-button {
      background: #e0e3e6;
      color: #9a9fa5;

      cursor: default;
      pointer-events: none;
    }


    /* HOLIDAY */

    .holiday {
      margin-top: 18px;

      border: 1px solid #eda2a2;

      background: var(--red-soft);

      border-radius: 14px;

      padding: 15px;

      color: #a92f2f;

      display: flex;
      align-items: center;
      gap: 12px;
    }

    .holiday-icon {
      font-size: 34px;
    }

    .holiday-title {
      font-size: 17px;
      font-weight: 900;
    }

    .holiday-text {
      margin-top: 2px;

      color: #4e5662;

      font-size: 14px;
    }


    /* FOOTER */

    .footer-card {
      margin-top: 18px;

      border: 1px solid var(--border);
      border-radius: 14px;

      background: white;

      padding: 15px;

      display: flex;
      align-items: center;
      gap: 12px;
    }

    .footer-icon {
      font-size: 34px;
    }

    .footer-title {
      font-weight: 900;
    }

    .footer-text {
      color: var(--muted);

      font-size: 13px;

      margin-top: 2px;
    }


    /* STATUS */

    .status {
      padding: 35px 15px;

      text-align: center;

      color: var(--muted);
    }

    .status-icon {
      font-size: 32px;

      margin-bottom: 8px;
    }

    .error-box {
      margin: 25px 0;

      padding: 18px;

      border-radius: 12px;

      background: #fff0f0;

      color: #a32d2d;

      border: 1px solid #efb0b0;
    }


    /* MODAL */

    .modal-backdrop {
      position: fixed;

      inset: 0;

      background: rgba(5,18,30,.55);

      display: none;

      align-items: center;
      justify-content: center;

      padding: 14px;

      z-index: 100;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      width: min(620px,100%);

      max-height: 92vh;
      overflow-y: auto;

      background: white;

      border-radius: 16px;

      box-shadow:
        0 24px 60px rgba(0,0,0,.22);

      padding: 18px;
    }

    .modal-header {
      display: flex;

      justify-content: space-between;
      align-items: flex-start;

      gap: 12px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 900;
    }

    .modal-date {
      color: var(--muted);

      margin-top: 3px;

      font-size: 14px;
    }

    .close-button {
      border: 0;
      background: transparent;

      font-size: 25px;

      cursor: pointer;
    }

    .change-grid {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 14px;

      margin-top: 18px;
    }

    .change-box {
      border: 1px solid var(--border);

      border-radius: 12px;

      padding: 12px;
    }

    .change-label {
      font-size: 12px;

      font-weight: 850;

      text-transform: uppercase;

      color: var(--muted);

      margin-bottom: 5px;
    }

    .current-driver {
      font-size: 18px;

      font-weight: 900;

      margin-bottom: 10px;
    }

    select {
      width: 100%;

      border: 1px solid #bec7d2;

      border-radius: 9px;

      padding: 10px 11px;

      background: white;

      color: var(--text);
    }

    .modal-note {
      margin-top: 18px;

      padding: 11px;

      border-radius: 9px;

      background: #fff8e7;

      border: 1px solid #efd79a;

      color: #765c17;

      font-size: 13px;
    }

    .modal-actions {
      display: flex;

      justify-content: flex-end;

      gap: 10px;

      margin-top: 18px;

      padding-top: 15px;

      border-top: 1px solid var(--border);
    }

    .btn {
      border-radius: 9px;

      padding: 10px 16px;

      font-weight: 850;

      cursor: pointer;

      border: 1px solid var(--border);
    }

    .btn-cancel {
      background: white;
      color: var(--text);
    }

    .btn-save {
      background: #dfe3e7;

      border-color: #dfe3e7;

      color: #8b9197;

      cursor: default;
    }


    /* MOBILE */

    @media (max-width: 720px) {

      .app {
        max-width: 100%;
        box-shadow: none;
      }

      .header {
        padding:
          18px 14px
          16px;
      }

      .header h1 {
        font-size: 22px;
      }

      .logo {
        width: 47px;
        height: 47px;

        font-size: 23px;
      }

      .toolbar {
        padding-left: 10px;
        padding-right: 10px;
      }

      .content {
        padding-left: 10px;
        padding-right: 10px;
      }

      .tab {
        font-size: 12px;

        padding: 12px 5px;
      }

      .week-title {
        font-size: 19px;
      }

      .ride-card {
        grid-template-columns:
          62px
          minmax(0,1fr)
          62px;

        grid-template-areas:
          "date details swap"
          "date to swap"
          "date from swap";

        gap: 7px 9px;

        padding: 8px;
      }

      .date-box {
        grid-area: date;

        min-height: 110px;

        align-self: stretch;
      }

      .date-number {
        font-size: 26px;
      }

      .details {
        grid-area: details;
      }

      .assignment.to {
        grid-area: to;
      }

      .assignment.from {
        grid-area: from;
      }

      .assignment {
        border-left: 0;

        border-top: 1px solid var(--border);

        padding:
          6px 0 0;
      }

      .assignment-label {
        font-size: 10px;

        margin-bottom: 2px;
      }

      .assignment-person {
        font-size: 14px;
      }

      .assignment-icon {
        font-size: 17px;
      }

      .swap-button {
        grid-area: swap;

        min-height: 100%;

        padding: 7px 4px;

        font-size: 12px;
      }

      .swap-icon {
        font-size: 22px;
      }

      .detail-row {
        font-size: 13px;

        margin: 3px 0;
      }

      .change-grid {
        grid-template-columns: 1fr;
      }

      .modal-actions {
        display: grid;

        grid-template-columns:
          1fr 1.2fr;
      }
    }

  </style>
</head>


<body>

<div class="app">

        </h1>

<!-- BYTTE-VINDU -->

  class="modal-backdrop"

>

    <div class="modal-header">

      <div>

        <div class="modal-title">

          class="modal-date"
          id="modalDate"
        ></div>

        class="close-button"

          <option value="">

          <option value="">

<script>

/*
=====================================================
 GOOGLE APPS SCRIPT
=====================================================
*/

const API_URL =
  "https://script.google.com/macros/s/AKfycbwDt3kSwSWaCwUMdbKvVD_YdWkyPOj20YNZhv47SPs8MSJyYu6-I9k7NiWkizwEvZMA/exec";


/*
=====================================================
 VARIABLES
=====================================================
*/

let rides = [];

let currentMode = "2";

let selectedRideId = null;


const scheduleEl =
  document.getElementById("schedule");

const backdrop =
  document.getElementById("modalBackdrop");

const modalDate =
  document.getElementById("modalDate");

const currentTo =
  document.getElementById("currentTo");

const currentFrom =
  document.getElementById("currentFrom");

const newTo =
  document.getElementById("newTo");

const newFrom =
  document.getElementById("newFrom");


/*
=====================================================
 LOAD GOOGLE SHEET
=====================================================
*/

async function loadSchedule() {

  try {

    const response =
      await fetch(
        API_URL + "?t=" + Date.now(),
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {
      throw new Error(
        "Kunne ikke hente data."
      );
    }


    const data =
      await response.json();


    if (!Array.isArray(data)) {
      throw new Error(
        "Ugyldig dataformat."
      );
    }


    rides = data
      .filter(
        ride =>
          ride.date &&
          ride.week
      )
      .sort(
        (a,b) =>
          parseDate(a.date) -
          parseDate(b.date)
      );


    renderSchedule();

  }

  catch (error) {

    console.error(error);


    scheduleEl.innerHTML = `

      <div class="error-box">

        <strong>
          Kunne ikke hente kjøreliste.
        </strong>

        <br><br>

        Prøv å laste siden på nytt.

      </div>

    `;

  }

}


/*
=====================================================
 DATE FUNCTIONS
=====================================================
*/

function parseDate(dateString) {

  const parts =
    dateString
      .split("-")
      .map(Number);


  return new Date(
    parts[0],
    parts[1] - 1,
    parts[2]
  );

}


function formatDate(dateString) {

  const date =
    parseDate(dateString);


  return new Intl.DateTimeFormat(
    "no-NO",
    {
      weekday: "long",
      day: "numeric",
      month: "long"
    }
  ).format(date);

}


function getDateParts(dateString) {

  const date =
    parseDate(dateString);


  const weekday =
    new Intl.DateTimeFormat(
      "no-NO",
      {
        weekday: "short"
      }
    )
    .format(date)
    .replace(".", "")
    .toUpperCase();


  const month =
    new Intl.DateTimeFormat(
      "no-NO",
      {
        month: "short"
      }
    )
    .format(date)
    .replace(".", "")
    .toUpperCase();


  return {
    weekday: weekday,
    day: date.getDate(),
    month: month
  };

}


/*
=====================================================
 PAST / TODAY
=====================================================
*/

function isPastRide(dateString) {

  const rideDate =
    parseDate(dateString);

  rideDate.setHours(
    0,0,0,0
  );


  const today =
    new Date();

  today.setHours(
    0,0,0,0
  );


  return rideDate < today;

}


/*
=====================================================
 TRANSPORT
=====================================================
*/

function transportIcon(person) {

  if (!person) {
    return "–";
  }


  if (person === "Jentene") {
    return "🚋";
  }


  if (person === "Ingen") {
    return "–";
  }


  return "🚗";

}


function displayPerson(person) {

  if (!person) {
    return "–";
  }

  return person;

}


/*
=====================================================
 CURRENT WEEK
=====================================================
*/

function getCurrentScheduleWeek() {

  const today =
    new Date();

  today.setHours(
    0,0,0,0
  );


  /*
    Finn uke ved å se hvilken
    mandag–søndag-periode dagens
    dato ligger i.
  */

  const weeks =
    [...new Set(
      rides.map(
        ride => ride.week
      )
    )];


  for (const week of weeks) {

    const weekRides =
      rides.filter(
        ride =>
          ride.week === week
      );


    if (!weekRides.length) {
      continue;
    }


    const dates =
      weekRides
        .map(
          ride =>
            parseDate(ride.date)
        )
        .sort(
          (a,b) => a-b
        );


    const firstDate =
      new Date(dates[0]);

    const lastDate =
      new Date(
        dates[dates.length - 1]
      );


    /*
      Utvid til mandag–søndag.
    */

    const monday =
      new Date(firstDate);

    const day =
      monday.getDay();

    const diff =
      day === 0
        ? -6
        : 1 - day;

    monday.setDate(
      monday.getDate() + diff
    );

    monday.setHours(
      0,0,0,0
    );


    const sunday =
      new Date(monday);

    sunday.setDate(
      monday.getDate() + 6
    );

    sunday.setHours(
      23,59,59,999
    );


    if (
      today >= monday &&
      today <= sunday
    ) {

      return week;

    }

  }


  /*
    Hvis vi er før eller mellom
    planlagte uker:
  */

  const futureRide =
    rides.find(
      ride =>
        parseDate(ride.date) >= today
    );


  if (futureRide) {
    return futureRide.week;
  }


  return rides.length
    ? rides[rides.length - 1].week
    : null;

}


/*
=====================================================
 RENDER
=====================================================
*/

function renderSchedule() {

  scheduleEl.innerHTML = "";


  if (!rides.length) {

    scheduleEl.innerHTML = `

      <div class="status">
        Ingen treninger funnet.
      </div>

    `;

    return;

  }


  const currentWeek =
    getCurrentScheduleWeek();


  const allWeeks =
    [...new Set(
      rides.map(
        ride => ride.week
      )
    )];


  let visibleWeeks = [];


  if (currentMode === "all") {

    visibleWeeks =
      allWeeks.filter(
        week =>
          week >= currentWeek
      );

  }

  else {

    const count =
      Number(currentMode);


    visibleWeeks =
      allWeeks
        .filter(
          week =>
            week >= currentWeek
        )
        .slice(
          0,
          count
        );

  }


  visibleWeeks.forEach(
    week => {

      const weekRides =
        rides.filter(
          ride =>
            ride.week === week
        );


      if (!weekRides.length) {
        return;
      }


      const allHoliday =
        weekRides.every(
          ride =>
            ride.to === "Ingen" &&
            ride.from === "Ingen"
        );


      if (allHoliday) {

        renderHoliday(
          week,
          weekRides
        );

        return;

      }


      const section =
        document.createElement(
          "section"
        );


      section.className =
        "week-section";


      const title =
        document.createElement(
          "div"
        );


      title.className =
        "week-title";


      let titleText =
        `Uke ${week}`;


      if (week === currentWeek) {

        titleText =
          `Denne uken – uke ${week}`;

      }

      else {

        const currentIndex =
          allWeeks.indexOf(
            currentWeek
          );

        const thisIndex =
          allWeeks.indexOf(
            week
          );


        if (
          thisIndex ===
          currentIndex + 1
        ) {

          titleText =
            `Neste uke – uke ${week}`;

        }

      }


      title.innerHTML = `

        <span>
          📅
        </span>

        <span>
          ${titleText}
        </span>

      `;


      section.appendChild(
        title
      );


      weekRides.forEach(
        ride => {

          /*
            Dersom en enkelt rad
            står som Ingen.
          */

          if (
            ride.to === "Ingen" &&
            ride.from === "Ingen"
          ) {

            return;

          }


          section.appendChild(
            createRideCard(
              ride,
              week !== currentWeek
            )
          );

        }
      );


      scheduleEl.appendChild(
        section
      );

    }
  );


  const footer =
    document.createElement(
      "div"
    );


  footer.className =
    "footer-card";


  footer.innerHTML = `

    <div class="footer-icon">
      🚗
    </div>

    <div>

      <div class="footer-title">
        Husk samkjøring
      </div>

      <div class="footer-text">
        Avtal bytte direkte,
        og oppdater deretter kjørelisten.
      </div>

    </div>

  `;


  scheduleEl.appendChild(
    footer
  );

}


/*
=====================================================
 RIDE CARD
=====================================================
*/

function createRideCard(
  ride,
  nextWeek
) {

  const date =
    getDateParts(
      ride.date
    );


  const past =
    isPastRide(
      ride.date
    );


  const card =
    document.createElement(
      "div"
    );


  card.className =
    "ride-card" +
    (nextWeek
      ? " next-week"
      : "") +
    (past
      ? " past"
      : "");


  card.innerHTML = `

    <div class="date-box">

      <div class="date-day">
        ${date.weekday}
      </div>

      <div class="date-number">
        ${date.day}
      </div>

      <div class="date-month">
        ${date.month}
      </div>

    </div>


    <div class="details">

      <div class="detail-row">

        <div class="detail-icon">
          🕒
        </div>

        <div>
          ${ride.time || "–"}
        </div>

      </div>


      <div class="detail-row">

        <div class="detail-icon">
          📍
        </div>

        <div>
          ${ride.place || "–"}
        </div>

      </div>

    </div>


    <div class="assignment to">

      <div class="assignment-label">
        Til trening
      </div>


      <div class="assignment-person">

        <span class="assignment-icon">
          ${transportIcon(ride.to)}
        </span>

        <span>
          ${displayPerson(ride.to)}
        </span>

      </div>

    </div>


    <div class="assignment from">

      <div class="assignment-label">
        Hente
      </div>


      <div class="assignment-person">

        <span class="assignment-icon">
          ${transportIcon(ride.from)}
        </span>

        <span>
          ${displayPerson(ride.from)}
        </span>

      </div>

    </div>


    <button
      class="swap-button"
      data-id="${ride.id}"
      ${past ? "disabled" : ""}
    >

      <span class="swap-icon">
        ⇄
      </span>

      ${past
        ? "Utført"
        : "Bytte"}

    </button>

  `;


  if (!past) {

    card
      .querySelector(
        ".swap-button"
      )
      .addEventListener(
        "click",
        () =>
          openModal(
            ride.id
          )
      );

  }


  return card;

}


/*
=====================================================
 HOLIDAY
=====================================================
*/

function renderHoliday(
  week,
  weekRides
) {

  const holiday =
    document.createElement(
      "div"
    );


  holiday.className =
    "holiday";


  const first =
    getDateParts(
      weekRides[0].date
    );


  const last =
    getDateParts(
      weekRides[
        weekRides.length - 1
      ].date
    );


  holiday.innerHTML = `

    <div class="holiday-icon">
      🍂
    </div>

    <div>

      <div class="holiday-title">
        Høstferie – uke ${week}
      </div>

      <div class="holiday-text">
        Ingen trening
        ${first.day}.–${last.day}.
        ${last.month.toLowerCase()}.
      </div>

    </div>

  `;


  scheduleEl.appendChild(
    holiday
  );

}


/*
=====================================================
 MODAL
=====================================================
*/

function openModal(rideId) {

  selectedRideId =
    rideId;


  const ride =
    rides.find(
      item =>
        String(item.id) ===
        String(rideId)
    );


  if (!ride) {
    return;
  }


  modalDate.textContent =
    `${formatDate(ride.date)} · ` +
    `${ride.time} · ` +
    `${ride.place}`;


  currentTo.innerHTML =
    `${transportIcon(ride.to)} ` +
    `${displayPerson(ride.to)}`;


  currentFrom.innerHTML =
    `${transportIcon(ride.from)} ` +
    `${displayPerson(ride.from)}`;


  newTo.value = "";
  newFrom.value = "";


  backdrop
    .classList
    .add("show");

}


function closeModal() {

  backdrop
    .classList
    .remove("show");


  selectedRideId = null;

}


document
  .getElementById(
    "closeModal"
  )
  .addEventListener(
    "click",
    closeModal
  );


document
  .getElementById(
    "cancelButton"
  )
  .addEventListener(
    "click",
    closeModal
  );


backdrop.addEventListener(
  "click",
  event => {

    if (
      event.target ===
      backdrop
    ) {

      closeModal();

    }

  }
);


document.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Escape"
    ) {

      closeModal();

    }

  }
);


/*
=====================================================
 TABS
=====================================================
*/

document
  .querySelectorAll(
    ".tab"
  )
  .forEach(
    tab => {

      tab.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(
              ".tab"
            )
            .forEach(
              item =>
                item
                  .classList
                  .remove(
                    "active"
                  )
            );


          tab
            .classList
            .add(
              "active"
            );


          currentMode =
            tab.dataset.mode;


          renderSchedule();

        }
      );

    }
  );


/*
=====================================================
 START
=====================================================
*/

loadSchedule();

</script>

</body>
</html>
