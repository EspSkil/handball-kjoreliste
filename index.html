<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">

<title>Kjøreliste håndball</title>

<style>

* {
  box-sizing: border-box;
}

:root {
  --navy: #082742;
  --navy-light: #123f69;

  --green: #159a61;
  --green-soft: #e8f6ee;

  --blue: #2266b0;
  --blue-soft: #edf4fb;

  --text: #172033;
  --muted: #6e7785;

  --border: #dfe5eb;
  --background: #f5f7f9;
  --card: #ffffff;

  --past-bg: #f1f3f5;
  --past-date: #e2e5e8;
  --past-text: #8a9097;

  --red-soft: #fff0f0;

  --orange: #a96700;
  --orange-soft: #fff5df;

  --shadow: 0 3px 10px rgba(0,0,0,.045);
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  background: var(--background);
  color: var(--text);
}

button,
select,
input {
  font: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
}

.app {
  max-width: 820px;
  margin: 0 auto;
  min-height: 100vh;
  background: white;
}


/* =====================================================
   HEADER
===================================================== */

.header {
  background: white;
  color: var(--navy);

  padding: 13px 16px 12px;

  border-top: 5px solid var(--navy);
  border-bottom: 2px solid var(--navy);
}

.header-row {
  display: flex;
  align-items: center;
  gap: 13px;
}

.club-logo {
  width: 56px;
  height: 56px;

  object-fit: contain;

  flex-shrink: 0;
}

.header h1 {
  margin: 0;

  font-size: 25px;
  line-height: 1.05;

  color: var(--navy);
}

.season {
  margin-top: 4px;

  font-size: 16px;

  color: #596675;
}


/* =====================================================
   MAIN NAVIGATION
===================================================== */

.main-navigation {
  padding: 11px 10px 5px;

  display: grid;
  grid-template-columns: 1fr 1fr;

  gap: 8px;

  background: white;
}

.main-nav-button {
  border: 1px solid var(--border);

  border-radius: 13px;

  padding: 10px 8px;

  background: white;

  color: #344055;

  font-size: 15px;
  font-weight: 850;

  cursor: pointer;
}

.main-nav-button.active {
  background: var(--navy);
  border-color: var(--navy);
  color: white;
}


/* =====================================================
   PERIOD TABS
===================================================== */

.toolbar {
  padding: 6px 10px 3px;

  background: white;

  position: sticky;
  top: 0;

  z-index: 10;
}

.toolbar.hidden {
  display: none;
}

.tabs {
  display: grid;

  grid-template-columns:
    1.25fr
    1fr
    1fr;

  border: 1px solid var(--border);

  border-radius: 13px;

  overflow: hidden;
}

.tab {
  border: 0;
  border-right: 1px solid var(--border);

  background: white;
  color: #344055;

  padding: 10px 5px;

  font-size: 13px;
  font-weight: 750;

  cursor: pointer;
}

.tab:last-child {
  border-right: 0;
}

.tab.active {
  background: var(--green);
  color: white;
}


/* =====================================================
   CONTENT
===================================================== */

.content {
  padding: 5px 10px 25px;
}

.week-section {
  margin-top: 14px;
}


/* =====================================================
   CALENDAR ICON
===================================================== */

.calendar-icon {
  width: 23px;
  height: 23px;

  border: 2px solid #8994a2;

  border-radius: 5px;

  position: relative;

  flex-shrink: 0;
}

.calendar-icon::before {
  content: "";

  position: absolute;

  left: -2px;
  right: -2px;
  top: 5px;

  height: 4px;

  background: #8994a2;
}

.calendar-icon::after {
  content: "";

  position: absolute;

  width: 3px;
  height: 3px;

  border-radius: 50%;

  background: #8994a2;

  left: 5px;
  bottom: 4px;

  box-shadow: 7px 0 #8994a2;
}


/* =====================================================
   WEEK TITLE
===================================================== */

.week-title {
  display: flex;
  align-items: center;

  gap: 8px;

  margin-bottom: 7px;

  font-size: 19px;
  font-weight: 850;
}


/* =====================================================
   RIDE CARDS
===================================================== */

.ride-card {
  display: grid;

  grid-template-columns:
    70px
    minmax(0,1fr)
    118px
    118px
    72px;

  gap: 8px;

  align-items: center;

  padding: 7px;

  margin-bottom: 7px;

  background: var(--card);

  border: 1px solid var(--border);

  border-radius: 13px;

  box-shadow: var(--shadow);
}


/* =====================================================
   DATE BOX
===================================================== */

.date-box {
  border-radius: 10px;

  padding: 5px;

  text-align: center;

  background: var(--green-soft);
  color: #147743;

  min-height: 72px;

  display: flex;
  flex-direction: column;
  justify-content: center;
}

.ride-card.next-week .date-box {
  background: var(--blue-soft);
  color: #245c99;
}

.date-day {
  font-size: 10px;
  font-weight: 850;
  text-transform: uppercase;
}

.date-number {
  font-size: 26px;
  font-weight: 900;
  line-height: 1;

  margin: 2px 0;
}

.date-month {
  font-size: 10px;
  font-weight: 750;
}


/* =====================================================
   DETAILS
===================================================== */

.details {
  min-width: 0;
}

.detail-row {
  display: flex;
  align-items: center;

  gap: 6px;

  margin: 2px 0;

  font-size: 14px;
}

.detail-icon {
  width: 18px;

  text-align: center;

  flex-shrink: 0;
}

.venue-row {
  display: flex;
  align-items: center;

  gap: 6px;
}

.venue-image {
  width: 58px;
  height: 34px;

  object-fit: cover;

  border-radius: 6px;

  margin-left: auto;

  border: 1px solid #d9dee4;
}


/* =====================================================
   DRIVER
===================================================== */

.assignment {
  min-width: 0;

  border-left: 1px solid var(--border);

  padding-left: 9px;
}

.assignment-label {
  font-size: 9px;

  color: var(--muted);

  font-weight: 850;

  text-transform: uppercase;

  margin-bottom: 2px;
}

.assignment-person {
  display: flex;
  align-items: center;

  gap: 5px;

  font-size: 14px;

  font-weight: 850;

  line-height: 1.05;
}

.assignment-icon {
  font-size: 16px;
}


/* =====================================================
   CHANGED
===================================================== */

.changed-badge {
  display: inline-flex;

  align-items: center;

  gap: 3px;

  margin-top: 4px;

  padding: 3px 6px;

  border-radius: 6px;

  background: var(--orange-soft);

  color: var(--orange);

  font-size: 9px;

  font-weight: 850;
}


/* =====================================================
   SWAP
===================================================== */

.swap-button {
  border: 0;

  border-radius: 9px;

  background: var(--green-soft);

  color: #157842;

  padding: 7px 4px;

  min-height: 54px;

  font-size: 11px;

  font-weight: 850;

  cursor: pointer;
}

.ride-card.next-week .swap-button {
  background: var(--blue-soft);
  color: var(--blue);
}

.swap-icon {
  display: block;

  font-size: 20px;

  line-height: 1;

  margin-bottom: 2px;
}


/* =====================================================
   PAST
===================================================== */

.ride-card.past {
  background: var(--past-bg);

  color: var(--past-text);

  box-shadow: none;

  opacity: .67;
}

.ride-card.past .date-box {
  background: var(--past-date);
  color: #6f767e;
}

.ride-card.past .assignment-label {
  color: #8b9198;
}

.ride-card.past .swap-button {
  background: #e0e3e6;
  color: #9a9fa5;

  pointer-events: none;
}


/* =====================================================
   HOLIDAY
===================================================== */

.holiday {
  margin-top: 14px;

  border: 1px solid #eda2a2;

  background: var(--red-soft);

  border-radius: 12px;

  padding: 12px;

  color: #a92f2f;

  display: flex;

  align-items: center;

  gap: 10px;
}

.holiday-icon {
  font-size: 28px;
}

.holiday-title {
  font-size: 16px;
  font-weight: 900;
}

.holiday-text {
  margin-top: 2px;

  color: #4e5662;

  font-size: 13px;
}


/* =====================================================
   FOOTER
===================================================== */

.footer-card {
  margin-top: 14px;

  border: 1px solid var(--border);

  border-radius: 13px;

  background: white;

  padding: 11px;

  display: flex;
  align-items: center;

  gap: 10px;
}

.footer-swap-icon {
  width: 38px;
  height: 38px;

  border-radius: 50%;

  display: grid;
  place-items: center;

  flex-shrink: 0;

  background: var(--navy);
  color: white;

  font-size: 21px;
}

.footer-title {
  font-weight: 900;
  font-size: 15px;
}

.footer-text {
  color: var(--muted);

  font-size: 12px;

  margin-top: 1px;
}


/* =====================================================
   STATUS
===================================================== */

.status {
  padding: 30px 15px;

  text-align: center;

  color: var(--muted);
}

.status-icon {
  font-size: 28px;

  margin-bottom: 7px;
}

.error-box {
  margin: 20px 0;

  padding: 15px;

  border-radius: 12px;

  background: #fff0f0;

  color: #a32d2d;

  border: 1px solid #efb0b0;
}


/* =====================================================
   GAMES
===================================================== */

.games-heading {
  margin-top: 14px;
  margin-bottom: 8px;

  display: flex;
  align-items: center;

  gap: 8px;

  font-size: 20px;
  font-weight: 900;
}

.game-card {
  display: grid;

  grid-template-columns:
    65px
    minmax(0,1fr);

  gap: 10px;

  padding: 9px;

  margin-bottom: 8px;

  background: white;

  border: 1px solid var(--border);

  border-radius: 13px;

  box-shadow: var(--shadow);
}

.game-card.past {
  background: var(--past-bg);

  color: var(--past-text);

  box-shadow: none;

  opacity: .68;
}

.game-date-box {
  background: var(--blue-soft);

  color: #245c99;

  border-radius: 10px;

  min-height: 100px;

  text-align: center;

  display: flex;
  flex-direction: column;
  justify-content: center;
}

.game-card.past .game-date-box {
  background: var(--past-date);
  color: #737980;
}

.game-time {
  font-size: 11px;

  font-weight: 850;

  margin-top: 4px;
}

.game-info {
  min-width: 0;
}

.game-teams {
  font-size: 16px;

  font-weight: 900;

  margin-bottom: 5px;

  line-height: 1.2;
}

.game-meta {
  display: flex;
  align-items: center;

  gap: 6px;

  margin: 3px 0;

  font-size: 12px;
}

.game-venue-row {
  display: flex;
  align-items: center;

  gap: 6px;
}

.game-venue-image {
  width: 62px;
  height: 37px;

  border-radius: 6px;

  object-fit: cover;

  margin-left: auto;

  border: 1px solid #d9dee4;
}

.game-tournament {
  margin-top: 5px;
  padding-top: 5px;

  border-top: 1px solid var(--border);

  font-size: 11px;

  color: var(--muted);
}

.map-link {
  display: inline-flex;

  align-items: center;

  gap: 4px;

  margin-top: 5px;

  padding: 5px 7px;

  border-radius: 7px;

  text-decoration: none;

  background: var(--blue-soft);

  color: var(--blue);

  font-size: 11px;

  font-weight: 850;
}


/* =====================================================
   MODAL
===================================================== */

.modal-backdrop {
  position: fixed;

  inset: 0;

  background: rgba(5,18,30,.55);

  display: none;

  align-items: center;
  justify-content: center;

  padding: 14px;

  z-index: 100;
}

.modal-backdrop.show {
  display: flex;
}

.modal {
  width: min(620px,100%);

  max-height: 92vh;

  overflow-y: auto;

  background: white;

  border-radius: 16px;

  box-shadow:
    0 24px 60px rgba(0,0,0,.22);

  padding: 18px;
}

.modal-header {
  display: flex;

  justify-content: space-between;
  align-items: flex-start;

  gap: 12px;
}

.modal-title {
  font-size: 20px;
  font-weight: 900;
}

.modal-date {
  color: var(--muted);

  margin-top: 3px;

  font-size: 14px;
}

.close-button {
  border: 0;

  background: transparent;

  font-size: 25px;

  cursor: pointer;
}

.change-grid {
  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 14px;

  margin-top: 18px;
}

.change-box {
  border: 1px solid var(--border);

  border-radius: 12px;

  padding: 12px;
}

.change-label {
  font-size: 12px;

  font-weight: 850;

  text-transform: uppercase;

  color: var(--muted);

  margin-bottom: 5px;
}

.current-driver {
  font-size: 18px;
  font-weight: 900;

  margin-bottom: 10px;
}

select {
  width: 100%;

  border: 1px solid #bec7d2;

  border-radius: 9px;

  padding: 10px 11px;

  background: white;

  color: var(--text);
}

.pin-wrap {
  margin-top: 18px;

  text-align: center;
}

.pin-label {
  font-size: 13px;

  font-weight: 850;

  margin-bottom: 7px;
}

.pin-input {
  width: 150px;

  text-align: center;

  letter-spacing: 8px;

  font-weight: 900;

  font-size: 20px;

  border: 1px solid #aeb8c4;

  border-radius: 10px;

  padding: 10px;
}

.pin-help {
  color: var(--muted);

  font-size: 12px;

  margin-top: 6px;
}

.modal-message {
  display: none;

  margin-top: 14px;

  padding: 11px;

  border-radius: 9px;

  font-size: 13px;
}

.modal-message.error {
  display: block;

  background: #fff0f0;

  color: #a42d2d;

  border: 1px solid #efb0b0;
}

.modal-message.success {
  display: block;

  background: var(--green-soft);

  color: #176e42;

  border: 1px solid #b9e0ca;
}

.modal-actions {
  display: flex;

  justify-content: flex-end;

  gap: 10px;

  margin-top: 18px;

  padding-top: 15px;

  border-top: 1px solid var(--border);
}

.btn {
  border-radius: 9px;

  padding: 10px 16px;

  font-weight: 850;

  cursor: pointer;

  border: 1px solid var(--border);
}

.btn-cancel {
  background: white;

  color: var(--text);
}

.btn-save {
  background: var(--green);

  border-color: var(--green);

  color: white;
}

.btn-save:disabled {
  background: #b9c1c9;

  border-color: #b9c1c9;

  cursor: default;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 720px) {

  .header {
    padding: 10px 12px 9px;
  }

  .club-logo {
    width: 48px;
    height: 48px;
  }

  .header h1 {
    font-size: 21px;
  }

  .season {
    font-size: 14px;
  }

  .main-navigation {
    padding-top: 9px;
  }

  .main-nav-button {
    padding: 9px 5px;

    font-size: 14px;
  }

  .tab {
    font-size: 11px;

    padding: 9px 4px;
  }

  .week-title {
    margin-top: 2px;

    font-size: 18px;
  }


  /* compact ride card */

  .ride-card {
    grid-template-columns:
      54px
      minmax(0,1fr)
      54px;

    grid-template-areas:
      "date details swap"
      "date to swap"
      "date from swap";

    gap: 4px 7px;

    padding: 6px;
  }

  .date-box {
    grid-area: date;

    min-height: 88px;

    align-self: stretch;
  }

  .date-number {
    font-size: 23px;
  }

  .details {
    grid-area: details;
  }

  .assignment.to {
    grid-area: to;
  }

  .assignment.from {
    grid-area: from;
  }

  .assignment {
    border-left: 0;

    border-top: 1px solid var(--border);

    padding: 4px 0 0;
  }

  .assignment-label {
    font-size: 9px;

    margin-bottom: 1px;
  }

  .assignment-person {
    font-size: 13px;
  }

  .assignment-icon {
    font-size: 15px;
  }

  .swap-button {
    grid-area: swap;

    min-height: 100%;

    padding: 5px 3px;

    font-size: 10px;
  }

  .swap-icon {
    font-size: 19px;
  }

  .detail-row {
    font-size: 12px;

    margin: 1px 0;
  }

  .venue-image {
    width: 55px;
    height: 32px;
  }


  /* games */

  .game-card {
    grid-template-columns:
      58px
      minmax(0,1fr);

    padding: 7px;
  }

  .game-date-box {
    min-height: 95px;
  }

  .game-teams {
    font-size: 15px;
  }

  .game-meta {
    font-size: 11px;
  }

  .game-venue-image {
    width: 57px;
    height: 34px;
  }


  /* modal */

  .change-grid {
    grid-template-columns: 1fr;
  }

  .modal-actions {
    display: grid;

    grid-template-columns:
      1fr 1.2fr;
  }

}

</style>
</head>


<body>

<div class="app">

<header class="header">

  <div class="header-row">

    <img
      src="assets/STB-logo.png"
      class="club-logo"
      alt="Stabæk"
    >

    <div>

      <h1>
        Kjøreliste håndball
      </h1>

      <div class="season">
        Høsten 2026
      </div>

    </div>

  </div>

</header>


<div class="main-navigation">

  <button
    id="ridesNav"
    class="main-nav-button active"
  >
    🚗 Kjøreliste
  </button>

  <button
    id="gamesNav"
    class="main-nav-button"
  >
    🤾 Kamper
  </button>

</div>


<div
  class="toolbar"
  id="rideToolbar"
>

  <div class="tabs">

    <button
      class="tab active"
      data-mode="2"
    >
      Denne + neste uke
    </button>

    <button
      class="tab"
      data-mode="4"
    >
      Neste 4 uker
    </button>

    <button
      class="tab"
      data-mode="all"
    >
      Hele planen
    </button>

  </div>

</div>


<main
  class="content"
  id="content"
>

  <div class="status">

    <div class="status-icon">
      ⏳
    </div>

    Henter data...

  </div>

</main>

</div>


<div
  class="modal-backdrop"
  id="modalBackdrop"
>

  <div class="modal">

    <div class="modal-header">

      <div>

        <div class="modal-title">
          Endre kjøring
        </div>

        <div
          class="modal-date"
          id="modalDate"
        ></div>

      </div>

      <button
        class="close-button"
        id="closeModal"
      >
        ×
      </button>

    </div>


    <div class="change-grid">

      <div class="change-box">

        <div class="change-label">
          Til trening
        </div>

        <div
          class="current-driver"
          id="currentTo"
        ></div>

        <div class="change-label">
          Velg ny
        </div>

        <select id="newTo">

          <option value="">
            Ingen endring
          </option>

          <option value="Frid">
            Frid
          </option>

          <option value="Hermine">
            Hermine
          </option>

          <option value="Malin">
            Malin
          </option>

          <option value="Jentene">
            Jentene
          </option>

          <option value="Ingen">
            Ingen
          </option>

        </select>

      </div>


      <div class="change-box">

        <div class="change-label">
          Hente
        </div>

        <div
          class="current-driver"
          id="currentFrom"
        ></div>

        <div class="change-label">
          Velg ny
        </div>

        <select id="newFrom">

          <option value="">
            Ingen endring
          </option>

          <option value="Frid">
            Frid
          </option>

          <option value="Hermine">
            Hermine
          </option>

          <option value="Malin">
            Malin
          </option>

          <option value="Jentene">
            Jentene
          </option>

          <option value="Ingen">
            Ingen
          </option>

        </select>

      </div>

    </div>


    <div class="pin-wrap">

      <div class="pin-label">
        PIN-kode
      </div>

      <input
        id="pin"
        class="pin-input"
        type="password"
        inputmode="numeric"
        maxlength="4"
        autocomplete="off"
        placeholder="••••"
      >

      <div class="pin-help">
        Bruk den felles firesifrede koden.
      </div>

    </div>


    <div
      class="modal-message"
      id="modalMessage"
    ></div>


    <div class="modal-actions">

      <button
        class="btn btn-cancel"
        id="cancelButton"
      >
        Avbryt
      </button>

      <button
        class="btn btn-save"
        id="saveButton"
      >
        Lagre endringer
      </button>

    </div>

  </div>

</div>


<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbwDt3kSwSWaCwUMdbKvVD_YdWkyPOj20YNZhv47SPs8MSJyYu6-I9k7NiWkizwEvZMA/exec";

const STORAGE_KEY =
  "handball_all_cache_v2";

let rides = [];
let games = [];

let currentMode = "2";
let currentView = "rides";
let selectedRideId = null;


const content =
  document.getElementById("content");

const rideToolbar =
  document.getElementById("rideToolbar");

const ridesNav =
  document.getElementById("ridesNav");

const gamesNav =
  document.getElementById("gamesNav");

const backdrop =
  document.getElementById("modalBackdrop");

const modalDate =
  document.getElementById("modalDate");

const currentTo =
  document.getElementById("currentTo");

const currentFrom =
  document.getElementById("currentFrom");

const newTo =
  document.getElementById("newTo");

const newFrom =
  document.getElementById("newFrom");

const pin =
  document.getElementById("pin");

const modalMessage =
  document.getElementById("modalMessage");

const saveButton =
  document.getElementById("saveButton");


async function loadAllData(showCachedFirst = true) {

  if (showCachedFirst) {

    try {

      const cached =
        localStorage.getItem(STORAGE_KEY);

      if (cached) {

        const parsed =
          JSON.parse(cached);

        if (
          parsed &&
          Array.isArray(parsed.rides)
        ) {

          rides =
            parsed.rides;

          games =
            Array.isArray(parsed.games)
              ? parsed.games
              : [];

          renderCurrentView();

        }

      }

    }

    catch (error) {}

  }


  try {

    const response =
      await fetch(
        API_URL + "?type=all",
        {
          cache: "no-cache"
        }
      );


    if (!response.ok) {
      throw new Error("HTTP-feil");
    }


    const data =
      await response.json();


    if (
      !data ||
      !Array.isArray(data.rides)
    ) {

      throw new Error(
        "Ugyldig data"
      );

    }


    rides =
      data.rides
        .filter(item => item.date)
        .sort(
          (a,b) =>
            parseDate(a.date) -
            parseDate(b.date)
        );


    games =
      Array.isArray(data.games)
        ? data.games
            .filter(item => item.date)
            .sort(
              (a,b) =>
                parseDate(a.date) -
                parseDate(b.date)
            )
        : [];


    try {

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify({
          rides,
          games
        })
      );

    }

    catch (error) {}


    renderCurrentView();

  }

  catch (error) {

    console.error(error);


    if (
      !rides.length &&
      !games.length
    ) {

      content.innerHTML = `

        <div class="error-box">

          <strong>
            Kunne ikke hente data.
          </strong>

          <br><br>

          Prøv å laste siden på nytt.

        </div>

      `;

    }

  }

}


function parseDate(dateString) {

  const parts =
    String(dateString)
      .split("-")
      .map(Number);

  return new Date(
    parts[0],
    parts[1] - 1,
    parts[2]
  );

}


function formatDate(dateString) {

  return new Intl
    .DateTimeFormat(
      "no-NO",
      {
        weekday: "long",
        day: "numeric",
        month: "long"
      }
    )
    .format(
      parseDate(dateString)
    );

}


function getDateParts(dateString) {

  const date =
    parseDate(dateString);


  const weekday =
    new Intl
      .DateTimeFormat(
        "no-NO",
        {
          weekday: "short"
        }
      )
      .format(date)
      .replace(".", "")
      .toUpperCase();


  const month =
    new Intl
      .DateTimeFormat(
        "no-NO",
        {
          month: "short"
        }
      )
      .format(date)
      .replace(".", "")
      .toUpperCase();


  return {
    weekday,
    day: date.getDate(),
    month
  };

}


function isPast(dateString) {

  const target =
    parseDate(dateString);

  target.setHours(0,0,0,0);


  const today =
    new Date();

  today.setHours(0,0,0,0);


  return target < today;

}


function getVenueImage(venue) {

  const text =
    String(venue || "")
      .toLowerCase();


  if (
    text.includes("nadderud")
  ) {

    return "assets/NA.jpg";

  }


  if (
    text.includes("haslum")
  ) {

    return "assets/Haslumhallen.jpg";

  }


  return "";

}


function transportIcon(person) {

  if (!person) {
    return "–";
  }


  if (
    person === "Jentene"
  ) {

    return "🚋";

  }


  if (
    person === "Ingen"
  ) {

    return "–";

  }


  return "🚗";

}


function displayPerson(person) {

  return person || "–";

}


function getCurrentScheduleWeek() {

  const today =
    new Date();

  today.setHours(0,0,0,0);


  const weeks =
    [...new Set(
      rides.map(
        ride => ride.week
      )
    )];


  for (
    const week
    of weeks
  ) {

    const weekRides =
      rides.filter(
        ride =>
          ride.week === week
      );


    if (!weekRides.length) {
      continue;
    }


    const firstDate =
      parseDate(
        weekRides[0].date
      );


    const monday =
      new Date(firstDate);


    const day =
      monday.getDay();


    const diff =
      day === 0
        ? -6
        : 1 - day;


    monday.setDate(
      monday.getDate() +
      diff
    );


    monday.setHours(
      0,0,0,0
    );


    const sunday =
      new Date(monday);


    sunday.setDate(
      monday.getDate() +
      6
    );


    sunday.setHours(
      23,59,59,999
    );


    if (
      today >= monday &&
      today <= sunday
    ) {

      return week;

    }

  }


  const futureRide =
    rides.find(
      ride =>
        parseDate(
          ride.date
        ) >= today
    );


  return futureRide
    ? futureRide.week
    : (
        rides.length
          ? rides[
              rides.length - 1
            ].week
          : null
      );

}


function renderCurrentView() {

  if (
    currentView === "games"
  ) {

    renderGames();

  }

  else {

    renderRides();

  }

}


function renderRides() {

  content.innerHTML = "";


  if (!rides.length) {

    content.innerHTML = `
      <div class="status">
        Ingen treninger funnet.
      </div>
    `;

    return;

  }


  const currentWeek =
    getCurrentScheduleWeek();


  const allWeeks =
    [...new Set(
      rides.map(
        ride => ride.week
      )
    )];


  let visibleWeeks;


  if (
    currentMode === "all"
  ) {

    visibleWeeks =
      allWeeks.filter(
        week =>
          week >= currentWeek
      );

  }

  else {

    visibleWeeks =
      allWeeks
        .filter(
          week =>
            week >= currentWeek
        )
        .slice(
          0,
          Number(currentMode)
        );

  }


  visibleWeeks.forEach(
    week => {


      const weekRides =
        rides.filter(
          ride =>
            ride.week === week
        );


      const holiday =
        weekRides.every(
          ride =>
            ride.to === "Ingen" &&
            ride.from === "Ingen"
        );


      if (holiday) {

        renderHoliday(
          week,
          weekRides
        );

        return;

      }


      const section =
        document.createElement(
          "section"
        );


      section.className =
        "week-section";


      const title =
        document.createElement(
          "div"
        );


      title.className =
        "week-title";


      let titleText =
        `Uke ${week}`;


      if (
        week === currentWeek
      ) {

        titleText =
          `Denne uken – uke ${week}`;

      }

      else {

        const ci =
          allWeeks.indexOf(
            currentWeek
          );


        const wi =
          allWeeks.indexOf(
            week
          );


        if (
          wi === ci + 1
        ) {

          titleText =
            `Neste uke – uke ${week}`;

        }

      }


      title.innerHTML = `

        <span class="calendar-icon"></span>

        <span>
          ${titleText}
        </span>

      `;


      section.appendChild(title);


      weekRides.forEach(
        ride => {


          if (
            ride.to === "Ingen" &&
            ride.from === "Ingen"
          ) {

            return;

          }


          section.appendChild(
            createRideCard(
              ride,
              week !== currentWeek
            )
          );

        }
      );


      content.appendChild(
        section
      );

    }
  );


  renderFooter();

}


function createRideCard(
  ride,
  nextWeek
) {

  const date =
    getDateParts(
      ride.date
    );


  const past =
    isPast(
      ride.date
    );


  const image =
    getVenueImage(
      ride.place
    );


  const card =
    document.createElement(
      "div"
    );


  card.className =
    "ride-card" +

    (
      nextWeek
        ? " next-week"
        : ""
    ) +

    (
      past
        ? " past"
        : ""
    );


  card.innerHTML = `

    <div class="date-box">

      <div class="date-day">
        ${date.weekday}
      </div>

      <div class="date-number">
        ${date.day}
      </div>

      <div class="date-month">
        ${date.month}
      </div>

    </div>


    <div class="details">

      <div class="detail-row">

        <div class="detail-icon">
          🕒
        </div>

        <div>
          ${ride.time || "–"}
        </div>

      </div>


      <div class="detail-row venue-row">

        <div class="detail-icon">
          📍
        </div>

        <div>
          ${ride.place || "–"}
        </div>

        ${
          image
            ? `
              <img
                src="${image}"
                class="venue-image"
                alt="${ride.place}"
              >
            `
            : ""
        }

      </div>


      ${
        ride.changed
          ? `
            <div class="changed-badge">
              ⇄ Endret
            </div>
          `
          : ""
      }

    </div>


    <div class="assignment to">

      <div class="assignment-label">
        Til trening
      </div>

      <div class="assignment-person">

        <span class="assignment-icon">
          ${transportIcon(
            ride.to
          )}
        </span>

        <span>
          ${displayPerson(
            ride.to
          )}
        </span>

      </div>

    </div>


    <div class="assignment from">

      <div class="assignment-label">
        Hente
      </div>

      <div class="assignment-person">

        <span class="assignment-icon">
          ${transportIcon(
            ride.from
          )}
        </span>

        <span>
          ${displayPerson(
            ride.from
          )}
        </span>

      </div>

    </div>


    <button
      class="swap-button"
      ${past ? "disabled" : ""}
    >

      <span class="swap-icon">
        ⇄
      </span>

      ${
        past
          ? "Utført"
          : "Bytte"
      }

    </button>

  `;


  if (!past) {

    card
      .querySelector(
        ".swap-button"
      )
      .addEventListener(
        "click",
        () =>
          openModal(
            ride.id
          )
      );

  }


  return card;

}


function renderHoliday(
  week,
  weekRides
) {

  const holiday =
    document.createElement(
      "div"
    );


  holiday.className =
    "holiday";


  holiday.innerHTML = `

    <div class="holiday-icon">
      🍂
    </div>

    <div>

      <div class="holiday-title">
        Høstferie – uke ${week}
      </div>

      <div class="holiday-text">
        Ingen trening denne uken.
      </div>

    </div>

  `;


  content.appendChild(
    holiday
  );

}


function renderFooter() {

  const footer =
    document.createElement(
      "div"
    );


  footer.className =
    "footer-card";


  footer.innerHTML = `

    <div class="footer-swap-icon">
      ⇄
    </div>

    <div>

      <div class="footer-title">
        Bytte kjøring
      </div>

      <div class="footer-text">
        Avtal bytte direkte, og oppdater deretter kjørelisten.
      </div>

    </div>

  `;


  content.appendChild(
    footer
  );

}


function renderGames() {

  content.innerHTML = "";


  const heading =
    document.createElement(
      "div"
    );


  heading.className =
    "games-heading";


  heading.innerHTML = `

    <span class="calendar-icon"></span>

    <span>
      Kamper
    </span>

  `;


  content.appendChild(
    heading
  );


  if (!games.length) {

    content.innerHTML += `

      <div class="status">
        Ingen kamper funnet.
      </div>

    `;

    return;

  }


  games.forEach(
    game => {

      content.appendChild(
        createGameCard(game)
      );

    }
  );

}


function createGameCard(game) {

  const date =
    getDateParts(
      game.date
    );


  const past =
    isPast(
      game.date
    );


  const image =
    getVenueImage(
      game.venue
    );


  const card =
    document.createElement(
      "div"
    );


  card.className =
    "game-card" +
    (
      past
        ? " past"
        : ""
    );


  const mapUrl =
    game.address
      ? (
          "https://www.google.com/maps/search/?api=1&query=" +
          encodeURIComponent(
            game.address
          )
        )
      : "";


  card.innerHTML = `

    <div class="game-date-box">

      <div class="date-day">
        ${date.weekday}
      </div>

      <div class="date-number">
        ${date.day}
      </div>

      <div class="date-month">
        ${date.month}
      </div>

      <div class="game-time">
        ${game.time || ""}
      </div>

    </div>


    <div class="game-info">

      <div class="game-teams">

        ${game.homeTeam || "–"}

        –

        ${game.awayTeam || "–"}

      </div>


      <div class="game-meta game-venue-row">

        <span>
          📍
        </span>

        <span>
          ${game.venue || "–"}
        </span>

        ${
          image
            ? `
              <img
                src="${image}"
                class="game-venue-image"
                alt="${game.venue}"
              >
            `
            : ""
        }

      </div>


      ${
        game.address
          ? `
            <div class="game-meta">

              <span>
                📌
              </span>

              <span>
                ${game.address}
              </span>

            </div>
          `
          : ""
      }


      ${
        mapUrl
          ? `
            <a
              class="map-link"
              href="${mapUrl}"
              target="_blank"
              rel="noopener"
            >
              📍 Åpne kart
            </a>
          `
          : ""
      }


      ${
        game.tournament
          ? `
            <div class="game-tournament">
              ${game.tournament}
            </div>
          `
          : ""
      }

    </div>

  `;


  return card;

}


function openModal(rideId) {

  selectedRideId =
    rideId;


  const ride =
    rides.find(
      item =>
        String(item.id) ===
        String(rideId)
    );


  if (!ride) {
    return;
  }


  modalDate.textContent =
    `${formatDate(
      ride.date
    )} · ${ride.time} · ${ride.place}`;


  currentTo.innerHTML =
    `${transportIcon(
      ride.to
    )} ${displayPerson(
      ride.to
    )}`;


  currentFrom.innerHTML =
    `${transportIcon(
      ride.from
    )} ${displayPerson(
      ride.from
    )}`;


  newTo.value = "";
  newFrom.value = "";
  pin.value = "";


  clearModalMessage();


  saveButton.disabled =
    false;


  saveButton.textContent =
    "Lagre endringer";


  backdrop
    .classList
    .add("show");

}


function closeModal() {

  backdrop
    .classList
    .remove("show");


  selectedRideId =
    null;


  clearModalMessage();

}


function wait(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


async function postChange(payload) {

  const response =
    await fetch(
      API_URL,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(
            payload
          )
      }
    );


  if (!response.ok) {

    throw new Error(
      "HTTP-feil"
    );

  }


  return await response.json();

}


async function saveChanges() {

  const ride =
    rides.find(
      item =>
        String(item.id) ===
        String(selectedRideId)
    );


  if (!ride) {
    return;
  }


  const selectedTo =
    newTo.value;


  const selectedFrom =
    newFrom.value;


  const enteredPin =
    pin.value.trim();


  if (
    !selectedTo &&
    !selectedFrom
  ) {

    showModalMessage(
      "Velg minst én endring.",
      "error"
    );

    return;

  }


  if (
    !/^\d{4}$/.test(
      enteredPin
    )
  ) {

    showModalMessage(
      "Skriv inn en firesifret PIN-kode.",
      "error"
    );

    return;

  }


  saveButton.disabled =
    true;


  saveButton.textContent =
    "Lagrer...";


  clearModalMessage();


  const payload = {

    id: ride.id,

    pin: enteredPin,

    to: selectedTo,

    from: selectedFrom

  };


  try {

    let result;


    try {

      result =
        await postChange(
          payload
        );

    }

    catch (
      firstError
    ) {

      await wait(
        1200
      );


      result =
        await postChange(
          payload
        );

    }


    if (
      !result.success
    ) {

      showModalMessage(
        result.message ||
        "Endringen kunne ikke lagres.",
        "error"
      );


      saveButton.disabled =
        false;


      saveButton.textContent =
        "Lagre endringer";


      return;

    }


    if (selectedTo) {
      ride.to = selectedTo;
    }


    if (selectedFrom) {
      ride.from = selectedFrom;
    }


    ride.changed =
      true;


    try {

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify({
          rides,
          games
        })
      );

    }

    catch (error) {}


    renderRides();


    showModalMessage(
      "✓ Kjørelisten er oppdatert.",
      "success"
    );


    loadAllData(false);


    setTimeout(
      closeModal,
      700
    );

  }

  catch (error) {

    console.error(error);


    showModalMessage(
      "Kunne ikke lagre. Prøv igjen.",
      "error"
    );


    saveButton.disabled =
      false;


    saveButton.textContent =
      "Lagre endringer";

  }

}


function showModalMessage(
  text,
  type
) {

  modalMessage.className =
    `modal-message ${type}`;


  modalMessage.textContent =
    text;

}


function clearModalMessage() {

  modalMessage.className =
    "modal-message";


  modalMessage.textContent =
    "";

}


ridesNav.addEventListener(
  "click",
  () => {

    currentView =
      "rides";


    ridesNav
      .classList
      .add("active");


    gamesNav
      .classList
      .remove("active");


    rideToolbar
      .classList
      .remove("hidden");


    renderRides();

  }
);


gamesNav.addEventListener(
  "click",
  () => {

    currentView =
      "games";


    gamesNav
      .classList
      .add("active");


    ridesNav
      .classList
      .remove("active");


    rideToolbar
      .classList
      .add("hidden");


    renderGames();

  }
);


document
  .querySelectorAll(".tab")
  .forEach(
    tab => {

      tab.addEventListener(
        "click",
        () => {


          document
            .querySelectorAll(".tab")
            .forEach(
              item =>
                item
                  .classList
                  .remove("active")
            );


          tab
            .classList
            .add("active");


          currentMode =
            tab.dataset.mode;


          renderRides();

        }
      );

    }
  );


document
  .getElementById("closeModal")
  .addEventListener(
    "click",
    closeModal
  );


document
  .getElementById("cancelButton")
  .addEventListener(
    "click",
    closeModal
  );


document
  .getElementById("saveButton")
  .addEventListener(
    "click",
    saveChanges
  );


backdrop.addEventListener(
  "click",
  event => {

    if (
      event.target ===
      backdrop
    ) {

      closeModal();

    }

  }
);


document.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Escape"
    ) {

      closeModal();

    }

  }
);


loadAllData(true);

</script>

</body>
</html>
