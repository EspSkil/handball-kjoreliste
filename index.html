<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#082742">

<title>Kjøreliste håndball</title>

<style>

* {
  box-sizing: border-box;
}

:root {
  --navy: #082742;
  --navy-light: #123f69;

  --green: #159a61;
  --green-soft: #e8f6ee;

  --blue: #2266b0;
  --blue-soft: #edf4fb;

  --yellow: #f5c945;

  --text: #172033;
  --muted: #6e7785;

  --border: #dfe5eb;
  --background: #f3f6f9;
  --card: #ffffff;

  --past-bg: #f1f3f5;
  --past-date: #e2e5e8;
  --past-text: #8a9097;

  --red: #c94141;
  --red-soft: #fff0f0;

  --orange: #a96700;
  --orange-soft: #fff5df;

  --shadow: 0 4px 14px rgba(0,0,0,.055);
}

body {
  margin: 0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  background: var(--background);
  color: var(--text);
}

button,
select,
input {
  font: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
}

.app {
  max-width: 820px;
  margin: 0 auto;

  min-height: 100vh;

  background: white;

  box-shadow:
    0 0 30px rgba(0,0,0,.04);
}


/* =====================================================
   HEADER
===================================================== */

.header {
  background:
    linear-gradient(
      135deg,
      var(--navy),
      #061a2e
    );

  color: white;

  padding:
    18px 18px
    17px;
}

.header-row {
  display: flex;
  align-items: center;

  gap: 15px;
}

.club-logo {
  width: 62px;
  height: 62px;

  object-fit: contain;

  flex-shrink: 0;
}

.header h1 {
  margin: 0;

  font-size: 27px;
  line-height: 1.05;
}

.season {
  margin-top: 5px;

  font-size: 17px;
  opacity: .87;
}


/* =====================================================
   MAIN NAVIGATION
===================================================== */

.main-navigation {
  padding:
    14px 14px
    5px;

  background: white;

  display: grid;
  grid-template-columns:
    1fr 1fr;

  gap: 8px;
}

.main-nav-button {
  border:
    1px solid var(--border);

  border-radius: 13px;

  padding:
    12px 10px;

  background: white;

  color: #344055;

  font-weight: 850;

  cursor: pointer;
}

.main-nav-button.active {
  background: var(--navy);
  border-color: var(--navy);

  color: white;
}


/* =====================================================
   PERIOD TABS
===================================================== */

.toolbar {
  padding:
    8px 14px
    6px;

  background: white;

  position: sticky;
  top: 0;

  z-index: 10;
}

.toolbar.hidden {
  display: none;
}

.tabs {
  display: grid;

  grid-template-columns:
    1.25fr
    1fr
    1fr;

  border:
    1px solid var(--border);

  border-radius: 14px;

  overflow: hidden;
}

.tab {
  border: 0;

  border-right:
    1px solid var(--border);

  background: white;

  color: #344055;

  padding:
    13px 8px;

  font-weight: 750;
  font-size: 14px;

  cursor: pointer;
}

.tab:last-child {
  border-right: 0;
}

.tab.active {
  background: var(--green);
  color: white;
}


/* =====================================================
   CONTENT
===================================================== */

.content {
  padding:
    8px 14px
    35px;
}

.week-section {
  margin-top: 22px;
}


/* =====================================================
   NEUTRAL CALENDAR ICON
===================================================== */

.calendar-icon {
  width: 27px;
  height: 27px;

  border:
    2px solid #8b95a2;

  border-radius: 5px;

  position: relative;

  flex-shrink: 0;
}

.calendar-icon::before {
  content: "";

  position: absolute;

  left: -2px;
  right: -2px;
  top: 6px;

  height: 5px;

  background: #8b95a2;
}

.calendar-icon::after {
  content: "";

  position: absolute;

  width: 4px;
  height: 4px;

  border-radius: 50%;

  background: #8b95a2;

  left: 5px;
  bottom: 5px;

  box-shadow:
    8px 0 #8b95a2;
}


/* =====================================================
   WEEK TITLE
===================================================== */

.week-title {
  display: flex;
  align-items: center;

  gap: 10px;

  margin-bottom: 10px;

  font-size: 21px;
  font-weight: 850;
}


/* =====================================================
   RIDE CARDS
===================================================== */

.ride-card {
  display: grid;

  grid-template-columns:
    86px
    minmax(0,1fr)
    145px
    145px
    86px;

  gap: 10px;

  align-items: center;

  padding: 10px;

  margin-bottom: 10px;

  background:
    var(--card);

  border:
    1px solid var(--border);

  border-radius: 14px;

  box-shadow:
    var(--shadow);
}


/* =====================================================
   DATE BOX
===================================================== */

.date-box {
  border-radius: 11px;

  padding:
    7px 6px;

  text-align: center;

  background:
    var(--green-soft);

  color:
    #147743;

  min-height: 88px;

  display: flex;

  flex-direction: column;

  justify-content: center;
}

.ride-card.next-week .date-box {
  background:
    var(--blue-soft);

  color:
    #245c99;
}

.date-day {
  font-size: 12px;

  font-weight: 850;

  text-transform:
    uppercase;
}

.date-number {
  font-size: 30px;

  font-weight: 900;

  line-height: 1;

  margin:
    3px 0;
}

.date-month {
  font-size: 12px;

  font-weight: 750;
}


/* =====================================================
   DETAILS
===================================================== */

.details {
  min-width: 0;
}

.detail-row {
  display: flex;

  align-items: center;

  gap: 8px;

  margin:
    5px 0;

  font-size: 15px;
}

.detail-icon {
  width: 20px;

  text-align: center;

  flex-shrink: 0;
}

.venue-row {
  display: flex;

  align-items: center;

  gap: 9px;
}

.venue-image {
  width: 82px;
  height: 48px;

  border-radius: 7px;

  object-fit: cover;

  margin-left: auto;

  border:
    1px solid #d9dee4;
}


/* =====================================================
   DRIVER
===================================================== */

.assignment {
  min-width: 0;

  border-left:
    1px solid var(--border);

  padding-left: 12px;
}

.assignment-label {
  font-size: 11px;

  color:
    var(--muted);

  font-weight: 850;

  text-transform:
    uppercase;

  letter-spacing:
    .35px;

  margin-bottom: 4px;
}

.assignment-person {
  display: flex;

  align-items: center;

  gap: 7px;

  font-size: 17px;

  font-weight: 850;

  line-height: 1.1;
}

.assignment-icon {
  font-size: 22px;
}


/* =====================================================
   CHANGED BADGE
===================================================== */

.changed-badge {
  display: inline-flex;

  align-items: center;

  gap: 4px;

  margin-top: 7px;

  padding:
    4px 7px;

  border-radius: 7px;

  background:
    var(--orange-soft);

  color:
    var(--orange);

  font-size: 11px;

  font-weight: 850;
}


/* =====================================================
   SWAP
===================================================== */

.swap-button {
  border: 0;

  border-radius: 10px;

  background:
    var(--green-soft);

  color:
    #157842;

  padding:
    10px 7px;

  font-weight: 850;

  cursor: pointer;

  min-height: 64px;
}

.ride-card.next-week .swap-button {
  background:
    var(--blue-soft);

  color:
    var(--blue);
}

.swap-icon {
  display: block;

  font-size: 25px;

  line-height: 1;

  margin-bottom: 3px;
}


/* =====================================================
   PAST RIDES
===================================================== */

.ride-card.past {
  background:
    var(--past-bg);

  color:
    var(--past-text);

  box-shadow: none;

  opacity: .67;
}

.ride-card.past .date-box {
  background:
    var(--past-date);

  color:
    #6f767e;
}

.ride-card.past .assignment-label {
  color:
    #8b9198;
}

.ride-card.past .assignment {
  border-color:
    #d5d9dd;
}

.ride-card.past .swap-button {
  background:
    #e0e3e6;

  color:
    #9a9fa5;

  cursor: default;

  pointer-events: none;
}


/* =====================================================
   HOLIDAY
===================================================== */

.holiday {
  margin-top: 18px;

  border:
    1px solid #eda2a2;

  background:
    var(--red-soft);

  border-radius: 14px;

  padding: 15px;

  color:
    #a92f2f;

  display: flex;

  align-items: center;

  gap: 12px;
}

.holiday-icon {
  font-size: 34px;
}

.holiday-title {
  font-size: 17px;

  font-weight: 900;
}

.holiday-text {
  margin-top: 2px;

  color:
    #4e5662;

  font-size: 14px;
}


/* =====================================================
   FOOTER
===================================================== */

.footer-card {
  margin-top: 18px;

  border:
    1px solid var(--border);

  border-radius: 14px;

  background: white;

  padding: 15px;

  display: flex;

  align-items: center;

  gap: 13px;
}

.footer-swap-icon {
  width: 45px;
  height: 45px;

  border-radius: 50%;

  display: grid;

  place-items: center;

  flex-shrink: 0;

  background:
    var(--navy);

  color: white;

  font-size: 25px;
}

.footer-title {
  font-weight: 900;
}

.footer-text {
  color:
    var(--muted);

  font-size: 13px;

  margin-top: 2px;
}


/* =====================================================
   STATUS
===================================================== */

.status {
  padding:
    35px 15px;

  text-align: center;

  color:
    var(--muted);
}

.status-icon {
  font-size: 32px;

  margin-bottom: 8px;
}

.error-box {
  margin:
    25px 0;

  padding: 18px;

  border-radius: 12px;

  background:
    #fff0f0;

  color:
    #a32d2d;

  border:
    1px solid #efb0b0;
}


/* =====================================================
   GAMES
===================================================== */

.games-heading {
  margin-top: 20px;

  margin-bottom: 11px;

  display: flex;

  align-items: center;

  gap: 10px;

  font-size: 22px;

  font-weight: 900;
}

.game-card {
  display: grid;

  grid-template-columns:
    78px
    minmax(0,1fr);

  gap: 13px;

  padding: 12px;

  margin-bottom: 11px;

  background: white;

  border:
    1px solid var(--border);

  border-radius: 14px;

  box-shadow:
    var(--shadow);
}

.game-card.past {
  background:
    var(--past-bg);

  color:
    var(--past-text);

  box-shadow: none;

  opacity: .68;
}

.game-date-box {
  background:
    var(--blue-soft);

  color:
    #245c99;

  border-radius: 11px;

  min-height: 112px;

  text-align: center;

  display: flex;

  flex-direction: column;

  justify-content: center;
}

.game-card.past .game-date-box {
  background:
    var(--past-date);

  color:
    #737980;
}

.game-time {
  font-size: 13px;

  font-weight: 850;

  margin-top: 5px;
}

.game-info {
  min-width: 0;
}

.game-teams {
  font-size: 19px;

  font-weight: 900;

  margin-bottom: 7px;

  line-height: 1.25;
}

.game-meta {
  display: flex;

  align-items: center;

  gap: 7px;

  margin:
    5px 0;

  font-size: 14px;
}

.game-venue-row {
  display: flex;

  align-items: center;

  gap: 10px;
}

.game-venue-image {
  width: 93px;
  height: 52px;

  border-radius: 7px;

  object-fit: cover;

  margin-left: auto;

  border:
    1px solid #d9dee4;
}

.game-tournament {
  margin-top: 8px;

  padding-top: 7px;

  border-top:
    1px solid var(--border);

  font-size: 12px;

  color:
    var(--muted);
}

.map-link {
  display: inline-flex;

  align-items: center;

  gap: 5px;

  margin-top: 8px;

  padding:
    7px 9px;

  border-radius: 8px;

  text-decoration: none;

  background:
    var(--blue-soft);

  color:
    var(--blue);

  font-size: 12px;

  font-weight: 850;
}


/* =====================================================
   MODAL
===================================================== */

.modal-backdrop {
  position: fixed;

  inset: 0;

  background:
    rgba(5,18,30,.55);

  display: none;

  align-items: center;

  justify-content: center;

  padding: 14px;

  z-index: 100;
}

.modal-backdrop.show {
  display: flex;
}

.modal {
  width:
    min(620px,100%);

  max-height: 92vh;

  overflow-y: auto;

  background: white;

  border-radius: 16px;

  box-shadow:
    0 24px 60px rgba(0,0,0,.22);

  padding: 18px;
}

.modal-header {
  display: flex;

  justify-content:
    space-between;

  align-items:
    flex-start;

  gap: 12px;
}

.modal-title {
  font-size: 20px;

  font-weight: 900;
}

.modal-date {
  color:
    var(--muted);

  margin-top: 3px;

  font-size: 14px;
}

.close-button {
  border: 0;

  background: transparent;

  font-size: 25px;

  cursor: pointer;
}

.change-grid {
  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 14px;

  margin-top: 18px;
}

.change-box {
  border:
    1px solid var(--border);

  border-radius: 12px;

  padding: 12px;
}

.change-label {
  font-size: 12px;

  font-weight: 850;

  text-transform:
    uppercase;

  color:
    var(--muted);

  margin-bottom: 5px;
}

.current-driver {
  font-size: 18px;

  font-weight: 900;

  margin-bottom: 10px;
}

select {
  width: 100%;

  border:
    1px solid #bec7d2;

  border-radius: 9px;

  padding:
    10px 11px;

  background: white;

  color:
    var(--text);
}

.pin-wrap {
  margin-top: 18px;

  text-align: center;
}

.pin-label {
  font-size: 13px;

  font-weight: 850;

  margin-bottom: 7px;
}

.pin-input {
  width: 150px;

  text-align: center;

  letter-spacing: 8px;

  font-weight: 900;

  font-size: 20px;

  border:
    1px solid #aeb8c4;

  border-radius: 10px;

  padding: 10px;
}

.pin-help {
  color:
    var(--muted);

  font-size: 12px;

  margin-top: 6px;
}

.modal-message {
  display: none;

  margin-top: 14px;

  padding: 11px;

  border-radius: 9px;

  font-size: 13px;
}

.modal-message.error {
  display: block;

  background:
    #fff0f0;

  color:
    #a42d2d;

  border:
    1px solid #efb0b0;
}

.modal-message.success {
  display: block;

  background:
    var(--green-soft);

  color:
    #176e42;

  border:
    1px solid #b9e0ca;
}

.modal-actions {
  display: flex;

  justify-content:
    flex-end;

  gap: 10px;

  margin-top: 18px;

  padding-top: 15px;

  border-top:
    1px solid var(--border);
}

.btn {
  border-radius: 9px;

  padding:
    10px 16px;

  font-weight: 850;

  cursor: pointer;

  border:
    1px solid var(--border);
}

.btn-cancel {
  background: white;

  color:
    var(--text);
}

.btn-save {
  background:
    var(--green);

  border-color:
    var(--green);

  color: white;
}

.btn-save:disabled {
  background:
    #b9c1c9;

  border-color:
    #b9c1c9;

  cursor: default;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 720px) {

  .app {
    max-width: 100%;

    box-shadow: none;
  }

  .header {
    padding:
      15px 14px
      14px;
  }

  .club-logo {
    width: 52px;
    height: 52px;
  }

  .header h1 {
    font-size: 22px;
  }

  .season {
    font-size: 15px;
  }

  .main-navigation {
    padding-left: 10px;
    padding-right: 10px;
  }

  .main-nav-button {
    font-size: 14px;
  }

  .toolbar {
    padding-left: 10px;
    padding-right: 10px;
  }

  .content {
    padding-left: 10px;
    padding-right: 10px;
  }

  .tab {
    font-size: 12px;

    padding:
      12px 5px;
  }

  .week-title {
    font-size: 19px;
  }


  /* RIDES */

  .ride-card {
    grid-template-columns:
      62px
      minmax(0,1fr)
      62px;

    grid-template-areas:
      "date details swap"
      "date to swap"
      "date from swap";

    gap:
      7px 9px;

    padding: 8px;
  }

  .date-box {
    grid-area: date;

    min-height: 110px;

    align-self: stretch;
  }

  .date-number {
    font-size: 26px;
  }

  .details {
    grid-area: details;
  }

  .assignment.to {
    grid-area: to;
  }

  .assignment.from {
    grid-area: from;
  }

  .assignment {
    border-left: 0;

    border-top:
      1px solid var(--border);

    padding:
      6px 0 0;
  }

  .assignment-label {
    font-size: 10px;

    margin-bottom: 2px;
  }

  .assignment-person {
    font-size: 14px;
  }

  .assignment-icon {
    font-size: 17px;
  }

  .swap-button {
    grid-area: swap;

    min-height: 100%;

    padding:
      7px 4px;

    font-size: 12px;
  }

  .swap-icon {
    font-size: 22px;
  }

  .detail-row {
    font-size: 13px;

    margin:
      3px 0;
  }

  .venue-image {
    width: 70px;
    height: 42px;
  }


  /* GAMES */

  .games-heading {
    font-size: 20px;
  }

  .game-card {
    grid-template-columns:
      66px minmax(0,1fr);

    gap: 10px;

    padding: 9px;
  }

  .game-date-box {
    min-height: 120px;
  }

  .game-teams {
    font-size: 17px;
  }

  .game-meta {
    font-size: 13px;
  }

  .game-venue-image {
    width: 80px;
    height: 47px;
  }


  /* MODAL */

  .change-grid {
    grid-template-columns:
      1fr;
  }

  .modal-actions {
    display: grid;

    grid-template-columns:
      1fr 1.2fr;
  }

}

</style>
</head>


<body>

<div class="app">

<header class="header">

  <div class="header-row">

    <img
      src="assets/STB-logo.png"
      class="club-logo"
      alt="Stabæk"
    >

    <div>

      <h1>
        Kjøreliste håndball
      </h1>

      <div class="season">
        Høsten 2026
      </div>

    </div>

  </div>

</header>


<div class="main-navigation">

  <button
    id="ridesNav"
    class="main-nav-button active"
  >
    🚗 Kjøreliste
  </button>

  <button
    id="gamesNav"
    class="main-nav-button"
  >
    🤾 Kamper
  </button>

</div>


<div
  class="toolbar"
  id="rideToolbar"
>

  <div class="tabs">

    <button
      class="tab active"
      data-mode="2"
    >
      Denne + neste uke
    </button>

    <button
      class="tab"
      data-mode="4"
    >
      Neste 4 uker
    </button>

    <button
      class="tab"
      data-mode="all"
    >
      Hele planen
    </button>

  </div>

</div>


<main
  class="content"
  id="content"
>

  <div class="status">

    <div class="status-icon">
      ⏳
    </div>

    Henter data...

  </div>

</main>

</div>


<!-- ==================================================
     SWAP MODAL
================================================== -->

<div
  class="modal-backdrop"
  id="modalBackdrop"
>

  <div class="modal">

    <div class="modal-header">

      <div>

        <div class="modal-title">
          Endre kjøring
        </div>

        <div
          class="modal-date"
          id="modalDate"
        ></div>

      </div>

      <button
        class="close-button"
        id="closeModal"
      >
        ×
      </button>

    </div>


    <div class="change-grid">

      <div class="change-box">

        <div class="change-label">
          Til trening
        </div>

        <div
          class="current-driver"
          id="currentTo"
        ></div>

        <div class="change-label">
          Velg ny
        </div>

        <select id="newTo">

          <option value="">
            Ingen endring
          </option>

          <option value="Frid">
            Frid
          </option>

          <option value="Hermine">
            Hermine
          </option>

          <option value="Malin">
            Malin
          </option>

          <option value="Jentene">
            Jentene
          </option>

          <option value="Ingen">
            Ingen
          </option>

        </select>

      </div>


      <div class="change-box">

        <div class="change-label">
          Hente
        </div>

        <div
          class="current-driver"
          id="currentFrom"
        ></div>

        <div class="change-label">
          Velg ny
        </div>

        <select id="newFrom">

/* =====================================================
   LOAD DATA
===================================================== */

async function loadAllData(
  showCachedFirst = true
) {

  if (showCachedFirst) {

    try {

      const cached =
        localStorage.getItem(
          STORAGE_KEY
        );

      if (cached) {

        const parsed =
          JSON.parse(
            cached
          );

        if (
          parsed &&
          Array.isArray(
            parsed.rides
          )
        ) {

          rides =
            parsed.rides;

          games =
            Array.isArray(
              parsed.games
            )
              ? parsed.games
              : [];

          renderCurrentView();

        }

      }

    }

    catch (error) {}

  }


  try {

    const response =
      await fetch(
        API_URL +
        "?type=all",
        {
          cache: "no-cache"
        }
      );


    if (!response.ok) {

      throw new Error(
        "HTTP-feil"
      );

    }


    const data =
      await response.json();


    if (
      !data ||
      !Array.isArray(
        data.rides
      )
    ) {

      throw new Error(
        "Ugyldig data"
      );

    }


    rides =
      data.rides
        .filter(
          item =>
            item.date
        )
        .sort(
          (a,b) =>
            parseDate(
              a.date
            ) -
            parseDate(
              b.date
            )
        );


    games =
      Array.isArray(
        data.games
      )
        ? data.games
            .filter(
              item =>
                item.date
            )
            .sort(
              (a,b) =>
                parseDate(
                  a.date
                ) -
                parseDate(
                  b.date
                )
            )
        : [];


    try {

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify({
          rides,
          games
        })
      );

    }

    catch (error) {}


    renderCurrentView();

  }

  catch (error) {

    console.error(
      error
    );


    if (
      !rides.length &&
      !games.length
    ) {

      content.innerHTML = `

        <div class="error-box">

          <strong>
            Kunne ikke hente data.
          </strong>

          <br><br>

          Prøv å laste siden på nytt.

        </div>

      `;

    }

  }

}


/* =====================================================
   DATE HELPERS
===================================================== */

function parseDate(
  dateString
) {

  const parts =
    String(
      dateString
    )
      .split("-")
      .map(Number);


  return new Date(
    parts[0],
    parts[1] - 1,
    parts[2]
  );

}


function formatDate(
  dateString
) {

  return new Intl
    .DateTimeFormat(
      "no-NO",
      {
        weekday:
          "long",

        day:
          "numeric",

        month:
          "long"
      }
    )
    .format(
      parseDate(
        dateString
      )
    );

}


function getDateParts(
  dateString
) {

  const date =
    parseDate(
      dateString
    );


  const weekday =
    new Intl
      .DateTimeFormat(
        "no-NO",
        {
          weekday:
            "short"
        }
      )
      .format(date)
      .replace(
        ".",
        ""
      )
      .toUpperCase();


  const month =
    new Intl
      .DateTimeFormat(
        "no-NO",
        {
          month:
            "short"
        }
      )
      .format(date)
      .replace(
        ".",
        ""
      )
      .toUpperCase();


  return {

    weekday,

    day:
      date.getDate(),

    month

  };

}


function isPast(
  dateString
) {

  const target =
    parseDate(
      dateString
    );

  target.setHours(
    0,0,0,0
  );


  const today =
    new Date();

  today.setHours(
    0,0,0,0
  );


  return target < today;

}


/* =====================================================
   IMAGES
===================================================== */

function getVenueImage(
  venue
) {

  const text =
    String(
      venue || ""
    ).toLowerCase();


  if (
    text.includes(
      "nadderud"
    )
  ) {

    return (
      "assets/NA.jpg"
    );

  }


  if (
    text.includes(
      "haslum"
    )
  ) {

    return (
      "assets/Haslumhallen.jpg"
    );

  }


  return "";

}


/* =====================================================
   DRIVER HELPERS
===================================================== */

function transportIcon(
  person
) {

  if (!person) {
    return "–";
  }


  if (
    person ===
    "Jentene"
  ) {

    return "🚋";

  }


  if (
    person ===
    "Ingen"
  ) {

    return "–";

  }


  return "🚗";

}


function displayPerson(
  person
) {

  return person || "–";

}


/* =====================================================
   CURRENT WEEK
===================================================== */

function getCurrentScheduleWeek() {

  const today =
    new Date();

  today.setHours(
    0,0,0,0
  );


  const weeks =
    [...new Set(
      rides.map(
        ride =>
          ride.week
      )
    )];


  for (
    const week
    of weeks
  ) {

    const weekRides =
      rides.filter(
        ride =>
          ride.week ===
          week
      );


    if (
      !weekRides.length
    ) {
      continue;
    }


    const firstDate =
      parseDate(
        weekRides[0]
          .date
      );


    const monday =
      new Date(
        firstDate
      );


    const day =
      monday.getDay();


    const diff =
      day === 0
        ? -6
        : 1 - day;


    monday.setDate(
      monday.getDate() +
      diff
    );


    monday.setHours(
      0,0,0,0
    );


    const sunday =
      new Date(
        monday
      );


    sunday.setDate(
      monday.getDate() +
      6
    );


    sunday.setHours(
      23,59,59,999
    );


    if (
      today >= monday &&
      today <= sunday
    ) {

      return week;

    }

  }


  const futureRide =
    rides.find(
      ride =>
        parseDate(
          ride.date
        ) >= today
    );


  return futureRide
    ? futureRide.week
    : (
        rides.length
          ? rides[
              rides.length - 1
            ].week
          : null
      );

}


/* =====================================================
   RENDER CURRENT VIEW
===================================================== */

function renderCurrentView() {

  if (
    currentView ===
    "games"

    renderGames();

  }

  else {

    renderRides();

  }

}


/* =====================================================
   RENDER RIDES
===================================================== */

function renderRides() {

  content.innerHTML = "";


  if (!rides.length) {

    content.innerHTML = `
      <div class="status">
        Ingen treninger funnet.
      </div>
    `;

    return;

  }


  const currentWeek =
    getCurrentScheduleWeek();


  const allWeeks =
    [...new Set(
      rides.map(
        ride =>
          ride.week
      )
    )];


  let visibleWeeks;


  if (
    currentMode ===
    "all"
  ) {

    visibleWeeks =
      allWeeks.filter(
        week =>
          week >=
          currentWeek
      );

  }

  else {

    visibleWeeks =
      allWeeks
        .filter(
          week =>
            week >=
            currentWeek
        )
        .slice(
          0,
          Number(
            currentMode
          )
        );

  }


  visibleWeeks.forEach(
    week => {


      const weekRides =
        rides.filter(
          ride =>
            ride.week ===
            week
        );


      const holiday =
        weekRides.every(
          ride =>
            ride.to ===
              "Ingen" &&
            ride.from ===
              "Ingen"
        );


      if (holiday) {

        renderHoliday(
          week,
          weekRides
        );

        return;

      }


      const section =
        document.createElement(
          "section"
        );


      section.className =
        "week-section";


      const title =
        document.createElement(
          "div"
        );


      title.className =
        "week-title";


      let titleText =
        `Uke ${week}`;


      if (
        week ===
        currentWeek
      ) {

        titleText =
          `Denne uken – uke ${week}`;

      }

      else {

        const ci =
          allWeeks.indexOf(
            currentWeek
          );


        const wi =
          allWeeks.indexOf(
            week
          );


        if (
          wi ===
          ci + 1
        ) {

          titleText =
            `Neste uke – uke ${week}`;

        }

      }


      title.innerHTML = `

        <span class="calendar-icon"></span>

        <span>
          ${titleText}
        </span>

      `;


      section.appendChild(
        title
      );


      weekRides.forEach(
        ride => {


          if (
            ride.to ===
              "Ingen" &&
            ride.from ===
              "Ingen"
          ) {

            return;

          }


          section.appendChild(
            createRideCard(
              ride,
              week !==
                currentWeek
            )
          );

        }
      );


      content.appendChild(
        section
      );

    }
  );


  renderFooter();

}

/* =====================================================
   MODAL
===================================================== */

function openModal(
  rideId
) {

  selectedRideId =
    rideId;


  const ride =
    rides.find(
      item =>
        String(item.id) ===
        String(rideId)
    );


  if (!ride) {
    return;
  }


  modalDate.textContent =
    `${formatDate(
      ride.date
    )} · ${ride.time} · ${ride.place}`;


  currentTo.innerHTML =
    `${transportIcon(
      ride.to
    )} ${displayPerson(
      ride.to
    )}`;


  currentFrom.innerHTML =
    `${transportIcon(
      ride.from
    )} ${displayPerson(
      ride.from
    )}`;


  newTo.value = "";
  newFrom.value = "";
  pin.value = "";


  clearModalMessage();


  saveButton.disabled =
    false;


  saveButton.textContent =
    "Lagre endringer";


  backdrop
    .classList
    .add(
      "show"
    );

}


function closeModal() {

  backdrop
    .classList
    .remove(
      "show"
    );


  selectedRideId =
    null;


  clearModalMessage();

}


/* =====================================================
   POST
===================================================== */

function wait(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


async function postChange(
  payload
) {

  const response =
    await fetch(
      API_URL,
      {
        method:
          "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(
            payload
          )
      }
    );


  if (!response.ok) {

    throw new Error(
      "HTTP-feil"
    );

  }


  return await response.json();

}


/* =====================================================
   SAVE CHANGE
===================================================== */

async function saveChanges() {

  const ride =
    rides.find(
      item =>
        String(item.id) ===
        String(
          selectedRideId
        )
    );


  if (!ride) {
    return;
  }


  const selectedTo =
    newTo.value;


  const selectedFrom =
    newFrom.value;


  const enteredPin =
    pin.value.trim();


  if (
    !selectedTo &&
    !selectedFrom
  ) {

    showModalMessage(
      "Velg minst én endring.",
      "error"
    );

    return;

  }


  if (
    !/^\d{4}$/.test(
      enteredPin
    )
  ) {

    showModalMessage(
      "Skriv inn en firesifret PIN-kode.",
      "error"
    );

    return;

  }


  saveButton.disabled =
    true;


  saveButton.textContent =
    "Lagrer...";


  clearModalMessage();


  const payload = {

    id:
      ride.id,

    pin:
      enteredPin,

    to:
      selectedTo,

    from:
      selectedFrom

  };


  try {

    let result;


    try {

      result =
        await postChange(
          payload
        );

    }

    catch (
      firstError
    ) {

      await wait(
        1200
      );


      result =
        await postChange(
          payload
        );

    }


    if (
      !result.success
    ) {

      showModalMessage(
        result.message ||
        "Endringen kunne ikke lagres.",
        "error"
      );


      saveButton.disabled =
        false;


      saveButton.textContent =
        "Lagre endringer";


      return;

    }


    if (
      selectedTo
    ) {

      ride.to =
        selectedTo;

    }


    if (
      selectedFrom
    ) {

      ride.from =
        selectedFrom;

    }


    /*
      Lokal markering.
      Når backend senere støtter changed,
      blir denne felles for alle.
    */

    ride.changed =
      true;


    try {

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify({
          rides,
          games
        })
      );

    }

    catch (error) {}


    renderRides();


    showModalMessage(
      "✓ Kjørelisten er oppdatert.",
      "success"
    );


    loadAllData(
      false
    );


    setTimeout(
      closeModal,
      700
    );

  }

  catch (error) {

    console.error(
      error
    );


    showModalMessage(
      "Kunne ikke lagre. Prøv igjen.",
      "error"
    );


    saveButton.disabled =
      false;


    saveButton.textContent =
      "Lagre endringer";

  }

}


/* =====================================================
   MODAL MESSAGES
===================================================== */

function showModalMessage(
  text,
  type
) {

  modalMessage.className =
    `modal-message ${type}`;


  modalMessage.textContent =
    text;

}


function clearModalMessage() {

  modalMessage.className =
    "modal-message";


  modalMessage.textContent =
    "";

}


/* =====================================================
   NAVIGATION
===================================================== */

ridesNav.addEventListener(
  "click",
  () => {

    currentView =
      "rides";


    ridesNav
      .classList
      .add(
        "active"
      );


    gamesNav
      .classList
      .remove(
        "active"
      );


    rideToolbar
      .classList
      .remove(
        "hidden"
      );


    renderRides();

  }
);


gamesNav.addEventListener(
  "click",
  () => {

    currentView =
      "games";


    gamesNav
      .classList
      .add(
        "active"
      );


    ridesNav
      .classList
      .remove(
        "active"
      );


    rideToolbar
      .classList
      .add(
        "hidden"
      );


    renderGames();

  }
);


/* =====================================================
   PERIOD BUTTONS
===================================================== */

document
  .querySelectorAll(
    ".tab"
  )
  .forEach(
    tab => {

      tab.addEventListener(
        "click",
        () => {


          document
            .querySelectorAll(
              ".tab"
            )
            .forEach(
              item =>
                item
                  .classList
                  .remove(
                    "active"
                  )
            );


          tab
            .classList
            .add(
              "active"
            );


          currentMode =
            tab.dataset.mode;


          renderRides();

        }
      );

    }
  );


/* =====================================================
   MODAL BUTTONS
===================================================== */

document
  .getElementById(
    "closeModal"
  )
  .addEventListener(
    "click",
    closeModal
  );


document
  .getElementById(
    "cancelButton"
  )
  .addEventListener(
    "click",
    closeModal
  );


document
  .getElementById(
    "saveButton"
  )
  .addEventListener(
    "click",
    saveChanges
  );


backdrop.addEventListener(
  "click",
  event => {

    if (
      event.target ===
      backdrop
    ) {

      closeModal();

    }

  }
);


document.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Escape"
    ) {

      closeModal();

    }

  }
);


/* =====================================================
   START
===================================================== */

loadAllData(
  true
);

</script>

</body>
</html>
